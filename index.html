<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>خط‌خطی | بازی نقاشی و حدس آنلاین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D1B;
  --surface:#12162A;
  --surface-2:#1A2036;
  --border: rgba(255,255,255,.08);
  --border-strong: rgba(255,255,255,.16);
  --text:#EEF0FB;
  --text-soft:#8B92B4;
  --brand:#6C6BFF;
  --brand2:#8B5CF6;
  --amber:#FFB84D;
  --pink:#FF6FA0;
  --green:#2ED47A;
  --coral:#FF5470;
  --radius: 18px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px;
  --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px; --s14: 56px;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
  -webkit-touch-callout:none;
}
input, textarea{ -webkit-user-select:text; -moz-user-select:text; -ms-user-select:text; user-select:text; }
html,body{height:100%;}
body{
  margin:0;
  font-family:'Vazirmatn',Tahoma,'Segoe UI',Arial,sans-serif;
  background:
    radial-gradient(900px 500px at 10% -5%, rgba(108,107,255,.16), transparent 60%),
    radial-gradient(800px 500px at 105% 8%, rgba(139,92,246,.14), transparent 55%),
    radial-gradient(700px 500px at 50% 115%, rgba(108,107,255,.08), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  min-height:100%;
  overflow-x:hidden;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}
button{font-family:inherit;}
input,button,select,textarea{font-size:16px;}
.wrap{width:100%; max-width:960px;}
.ic{display:inline-block; vertical-align:middle; flex-shrink:0; line-height:0;}

.btn{
  font-family:inherit; font-weight:700; font-size:16px; cursor:pointer;
  border:1.5px solid var(--border-strong); border-radius:14px; padding:13px 22px;
  background:var(--surface-2); color:var(--text);
  box-shadow:0 10px 24px -12px rgba(0,0,0,.7);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4; cursor:not-allowed; filter:none;}
.btn:disabled:active{transform:none;}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; border-color:transparent; box-shadow:0 14px 30px -10px rgba(108,107,255,.5);}
.btn-yellow{background:linear-gradient(135deg,var(--amber),#FFD98A); color:#2B1B02; border-color:transparent; box-shadow:0 14px 30px -10px rgba(255,184,77,.4);}
.btn-ghost{background:transparent; box-shadow:none;}
.btn-sm{padding:8px 14px; font-size:14px; border-radius:11px; box-shadow:0 8px 18px -10px rgba(0,0,0,.7);}
.btn-block{width:100%;}
.btn-icon{padding:9px 12px;}
.btn-icon svg{width:16px; height:16px;}

.field{margin-bottom:var(--s3); text-align:right;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--text-soft); margin-bottom:var(--s2);}
.input{
  width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--border-strong);
  background:var(--bg); color:var(--text); font-weight:600; outline:none; text-align:right;
}
.input:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(108,107,255,.16);}
.input::placeholder{color:var(--text-soft); font-weight:500;}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:0 26px 60px -24px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.04); padding:22px;
}

#toast{
  position:fixed; top:var(--s4); left:50%;
  transform:translateX(-50%) translateY(-8px);
  background:var(--surface-2); color:var(--text); padding:var(--s3) var(--s5); border-radius:12px; font-weight:600;
  font-size:14px; z-index:999; max-width:90vw; text-align:center;
  border:1px solid var(--border-strong);
  box-shadow:0 16px 36px -12px rgba(0,0,0,.8);
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .3s;
}
#toast.show{
  opacity:1; visibility:visible; pointer-events:auto;
  transform:translateX(-50%) translateY(0);
  transition:opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1), visibility 0s linear 0s;
}

.brand{display:flex; align-items:center; justify-content:center; gap:var(--s3); margin:var(--s2) 0;}
.brand h1{
  font-size:26px; margin:0; font-weight:900; letter-spacing:-.3px;
  display:inline-flex; align-items:center; gap:var(--s2);
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.brand h1 svg{color:var(--amber);}
.section-title{font-weight:800; font-size:15px; margin:0 0 var(--s3); color:var(--brand);}
.empty-note{color:var(--text-soft); font-size:13.5px; text-align:center; padding:var(--s4) 0;}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;border:2px solid rgba(255,255,255,.2);flex-shrink:0;}

.final-list{display:flex; flex-direction:column; gap:var(--s3); margin:var(--s5) 0;}
.final-row{display:flex; align-items:center; gap:var(--s4); padding:var(--s4) var(--s5); background:var(--surface); border:1px solid var(--border);}
.final-row .rank{font-size:22px; font-weight:900; width:34px; text-align:center; display:inline-flex; align-items:center; justify-content:center;}
.final-row .rank svg{width:24px; height:24px;}
.final-row .nm{flex:1; font-weight:800; font-size:17px; text-align:right;}
.final-row .sc{font-weight:900; font-size:19px; color:var(--brand);}
.final-row.r1{background:linear-gradient(135deg, rgba(255,184,77,.22), rgba(255,184,77,.06)); border-color:rgba(255,184,77,.4);}
.final-row.r2{background:var(--surface-2); border-color:var(--border-strong);}
.final-row.r3{background:linear-gradient(135deg, rgba(255,122,89,.18), rgba(255,122,89,.05)); border-color:rgba(255,122,89,.3);}
.final-actions{display:flex; gap:var(--s3); justify-content:center; flex-wrap:wrap;}
.final-row.r1 .rank{display:inline-flex; animation:bounce 1.1s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}

.confetti-layer{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:998;}
.confetti-piece{position:absolute; top:-20px; border-radius:2px; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:.9;}}

.pop{animation:popIn .28s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1;}}
.fadeUp{animation:fadeUp .35s ease both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

.conn-banner{position:fixed; bottom:0; left:0; right:0; background:var(--coral); color:#1A0510; text-align:center; font-weight:700; font-size:13.5px; padding:var(--s3); z-index:1000; display:none;}
.conn-banner.show{display:block;}

#app{transition:opacity .2s ease, transform .25s cubic-bezier(.22,1,.36,1);}
#app.screen-exit{opacity:0; transform:translateY(10px);}

/* ==================== SHARED ROOTS ==================== */
.home-root, .lobby-root, .game-root{
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  background:#0A0D1B;
  position:relative; isolation:isolate;
}
.home-root::before, .lobby-root::before, .game-root::before{
  content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(700px 420px at 88% -6%, rgba(108,107,255,.13), transparent 68%);
}
.home-root > *, .lobby-root > *, .game-root > *{position:relative; z-index:1;}

.home-header{
  display:flex; align-items:center; justify-content:space-between;
  height:64px; padding:0 var(--s8);
  border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
  gap:var(--s3);
}
@media (max-width:640px){ .home-header{padding:0 var(--s5); height:60px;} }

.home-brand{display:flex; align-items:center; gap:var(--s3); font-weight:800; font-size:15px; color:var(--text);}
.home-brand-mark{
  width:30px; height:30px; border-radius:9px;
  background:rgba(108,107,255,.12);
  border:1px solid rgba(108,107,255,.28);
  color:#A8A6FF;
  display:grid; place-items:center;
  flex-shrink:0;
}

/* ---- MUTE BUTTON ---- */
.mute-btn{
  width:36px; height:36px;
  border-radius:10px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  color:var(--text-soft);
  cursor:pointer;
  display:grid; place-items:center;
  transition:background .2s, color .2s, border-color .2s, transform .12s;
  flex-shrink:0;
  padding:0;
}
.mute-btn:hover{background:rgba(255,255,255,.06); color:var(--text);}
.mute-btn:active{transform:scale(.94);}
.mute-btn.muted{color:var(--coral); border-color:rgba(255,84,112,.3); background:rgba(255,84,112,.08);}
.mute-btn svg{width:17px; height:17px;}

@keyframes hmRise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

/* ==================== HOME ==================== */
.home-body{
  flex:1;
  display:grid; grid-template-columns:1.15fr .85fr;
  min-height:0;
}
@media (max-width:900px){.home-body{grid-template-columns:1fr;}}

.home-intro{
  padding:var(--s14) var(--s10);
  display:flex; flex-direction:column; justify-content:center;
  border-left:1px solid rgba(255,255,255,.06);
  animation:hmRise .55s cubic-bezier(.22,1,.36,1) both;
}
@media (max-width:900px){
  .home-intro{
    padding:var(--s10) var(--s5) var(--s8);
    border-left:none;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
}

.home-title{
  margin:0;
  font-size:clamp(58px,8.5vw,92px);
  font-weight:900; letter-spacing:-2.5px; line-height:.95;
  color:#fff;
}
.home-title .mark{
  display:inline-block;
  width:.2em; height:.2em; border-radius:50%;
  background:var(--brand);
  margin-inline-start:.12em;
  transform:translateY(-.15em);
}

.home-doodle{
  width:200px; max-width:60%;
  height:auto;
  color:rgba(168,166,255,.7);
  margin-top:var(--s4);
}
.home-doodle path{
  stroke-dasharray:340; stroke-dashoffset:340;
  animation:hmDraw 1.6s .35s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes hmDraw{to{stroke-dashoffset:0;}}

.home-desc{
  margin:var(--s5) 0 0;
  max-width:400px;
  font-size:15px; font-weight:500; line-height:1.95;
  color:var(--text-soft);
}
.home-desc b{color:var(--text); font-weight:700;}

.home-form-wrap{
  padding:var(--s14) var(--s10);
  display:flex; flex-direction:column; justify-content:center;
}
@media (max-width:900px){
  .home-form-wrap{padding:var(--s8) var(--s5) var(--s10);}
}
.home-form{
  width:100%; max-width:380px; margin:0 auto;
  animation:hmRise .55s .1s cubic-bezier(.22,1,.36,1) both;
}

.home-tabs{
  display:flex; position:relative;
  border-bottom:1px solid rgba(255,255,255,.08);
  margin-bottom:var(--s8);
}
.home-tab{
  flex:1; position:relative;
  padding:var(--s4) var(--s2);
  background:transparent; border:none;
  color:var(--text-soft);
  font-family:inherit; font-weight:700; font-size:14.5px;
  cursor:pointer;
  transition:color .2s;
}
.home-tab:hover{color:var(--text);}
.home-tab.active{color:var(--text);}
.home-tab.active::after{
  content:""; position:absolute;
  left:22%; right:22%; bottom:-1px;
  height:2px; border-radius:2px;
  background:var(--brand);
  animation:hmTab .3s cubic-bezier(.4,0,.2,1);
}
@keyframes hmTab{from{transform:scaleX(.4); opacity:.4;} to{transform:scaleX(1); opacity:1;}}

.home-field{margin-bottom:var(--s5);}
.home-field label{
  display:block; margin-bottom:var(--s3);
  font-size:12px; font-weight:700; letter-spacing:.2px;
  color:var(--text-soft);
}
.home-input{
  width:100%; padding:14px 16px;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  color:var(--text);
  font-family:inherit; font-weight:600; font-size:15px;
  line-height:1.4;
  outline:none; text-align:right;
  transition:border-color .2s, background .2s;
}
.home-input:hover{border-color:rgba(255,255,255,.16);}
.home-input:focus{
  border-color:var(--brand);
  background:rgba(108,107,255,.06);
}
.home-input::placeholder{color:rgba(139,146,180,.55); font-weight:500;}
.home-input--code{
  text-align:center; letter-spacing:8px; text-indent:8px;
  font-weight:800; font-size:18px;
}
.home-input--code::placeholder{letter-spacing:.5px; text-indent:0; font-weight:600; font-size:13.5px;}

.home-input-wrap{position:relative;}
.home-input-hint{
  position:absolute; inset:0;
  padding:14px 16px;
  display:flex; align-items:center; justify-content:flex-start;
  font-family:inherit; font-weight:600; font-size:15px; line-height:1.4;
  pointer-events:none;
  overflow:hidden;
  direction:rtl;
  white-space:pre;
  color:rgba(139,146,180,.6);
  transition:opacity .16s ease;
}
.home-input-hint.is-hidden{ opacity:0; }
.hint-typed{ color:transparent; }
.hint-rest{ color:rgba(139,146,180,.6); }

.home-cta{
  width:100%; padding:15px 20px; margin-top:var(--s1);
  background:var(--brand); border:none; border-radius:12px;
  color:#fff;
  font-family:inherit; font-weight:800; font-size:15.5px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:var(--s3);
  transition:background .2s, transform .12s;
}
.home-cta:hover{background:#7B7AFF;}
.home-cta:active{transform:scale(.985);}
.home-cta svg{transition:transform .25s;}
.home-cta:hover svg{transform:translateX(-3px);}

.home-help{
  margin-top:var(--s8); padding-top:var(--s5);
  border-top:1px solid rgba(255,255,255,.06);
}
.home-help summary{
  list-style:none; cursor:pointer;
  display:flex; align-items:center; justify-content:space-between;
  font-size:12.5px; font-weight:700; color:var(--text-soft);
  transition:color .2s;
}
.home-help summary:hover{color:var(--text);}
.home-help summary::-webkit-details-marker{display:none;}
.home-help summary::after{
  content:""; width:7px; height:7px;
  border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;
  transform:rotate(45deg); margin-top:-4px;
  transition:transform .25s;
}
.home-help[open] summary::after{transform:rotate(-135deg); margin-top:4px;}
.home-help-body{
  padding-top:var(--s4);
  font-size:12.5px; line-height:2.05;
  color:var(--text-soft);
}
.home-help-body b{color:var(--text); font-weight:700;}

/* ==================== LOBBY ==================== */
.lobby-body{
  flex:1;
  display:grid; grid-template-columns:1.15fr .85fr;
  min-height:0;
}
@media (max-width:900px){.lobby-body{grid-template-columns:1fr;}}

.lobby-left{
  padding:var(--s14) var(--s10);
  display:flex; flex-direction:column;
  gap:var(--s6);
  border-left:1px solid rgba(255,255,255,.06);
  animation:hmRise .55s cubic-bezier(.22,1,.36,1) both;
}
@media (max-width:900px){
  .lobby-left{
    padding:var(--s10) var(--s5) var(--s8);
    border-left:none;
    border-bottom:1px solid rgba(255,255,255,.06);
    gap:var(--s5);
  }
}

.lobby-eyebrow{
  display:flex; align-items:center; gap:var(--s3);
  font-size:11px; font-weight:700; letter-spacing:1.5px;
  color:var(--text-soft);
  text-transform:uppercase;
}
.lobby-eyebrow::before{
  content:""; width:22px; height:1px; background:currentColor; opacity:.55;
}

.lobby-code-row{
  display:flex; align-items:flex-end; gap:var(--s4); flex-wrap:wrap;
}
.lobby-code{
  font-size:clamp(44px,6.5vw,64px);
  font-weight:900; letter-spacing:6px; line-height:1;
  color:#fff;
  direction:ltr;
}
.lobby-copy{
  display:inline-flex; align-items:center; gap:var(--s2);
  padding:9px 14px;
  background:transparent;
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  color:var(--text-soft);
  font-family:inherit; font-weight:700; font-size:12px;
  cursor:pointer;
  transition:color .2s, border-color .2s, background .2s;
  margin-bottom:4px;
}
.lobby-copy:hover{color:var(--text); border-color:rgba(255,255,255,.24); background:rgba(255,255,255,.03);}
.lobby-copy svg{width:13px; height:13px;}

.lobby-note{
  margin:0;
  font-size:13px; font-weight:500; line-height:1.95;
  color:var(--text-soft);
  max-width:360px;
}

.lobby-players-head{
  display:flex; align-items:center; gap:var(--s3);
  font-size:11px; font-weight:700; letter-spacing:1.5px;
  color:var(--text-soft); text-transform:uppercase;
  padding-bottom:var(--s3);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.lobby-players-head .count{
  padding:2px 8px;
  background:rgba(108,107,255,.14);
  border:1px solid rgba(108,107,255,.25);
  border-radius:20px;
  color:#A8A6FF;
  font-size:10.5px;
  letter-spacing:0;
}

.lobby-players{
  display:flex; flex-direction:column;
  margin-top:calc(var(--s6) * -1 + var(--s5));
}
.lobby-player{
  display:flex; align-items:center; gap:var(--s3);
  padding:var(--s3) 0;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.lobby-player:last-child{border-bottom:none;}
.lobby-player.lobby-player--enter{animation:fadeUp .35s ease both;}
.lobby-player .avatar{
  width:32px; height:32px; font-size:13px;
  border-width:1.5px;
}
.lobby-player .nm{
  flex:1; font-weight:700; font-size:14.5px;
  color:var(--text); text-align:right;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.lobby-player .host-tag{
  display:inline-flex; align-items:center; gap:5px;
  font-size:10.5px; font-weight:700; letter-spacing:.3px;
  padding:3px 9px;
  background:rgba(255,184,77,.1);
  border:1px solid rgba(255,184,77,.24);
  color:#FFB84D;
  border-radius:20px;
  flex-shrink:0;
}
.lobby-player .host-tag svg{width:11px; height:11px;}

.lobby-right{
  padding:var(--s14) var(--s10);
  display:flex; flex-direction:column; justify-content:center;
}
@media (max-width:900px){
  .lobby-right{padding:var(--s8) var(--s5) var(--s10);}
}
.lobby-form{
  width:100%; max-width:380px; margin:0 auto;
  animation:hmRise .55s .1s cubic-bezier(.22,1,.36,1) both;
}

.lobby-field{margin-bottom:var(--s6);}
.lobby-field > label{
  display:block; margin-bottom:var(--s3);
  font-size:12px; font-weight:700; letter-spacing:.2px;
  color:var(--text-soft);
}
.lobby-chips{display:flex; gap:var(--s2); flex-wrap:wrap;}
.lobby-chip{
  padding:9px 14px;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;
  color:var(--text-soft);
  font-family:inherit; font-weight:700; font-size:13px;
  cursor:pointer;
  transition:color .2s, border-color .2s, background .2s;
}
.lobby-chip:hover:not(.readonly){color:var(--text); border-color:rgba(255,255,255,.2);}
.lobby-chip.active{background:rgba(108,107,255,.14); border-color:rgba(108,107,255,.45); color:#A8A6FF;}
.lobby-chip.readonly{cursor:default; opacity:.65;}

.lobby-cta{
  width:100%; padding:15px 20px; margin-top:var(--s2);
  background:var(--brand); border:none; border-radius:12px;
  color:#fff;
  font-family:inherit; font-weight:800; font-size:15.5px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:var(--s3);
  transition:background .2s, transform .12s;
}
.lobby-cta:hover:not(:disabled){background:#7B7AFF;}
.lobby-cta:active:not(:disabled){transform:scale(.985);}
.lobby-cta:disabled{opacity:.35; cursor:not-allowed;}
.lobby-cta svg{transition:transform .25s;}
.lobby-cta:hover:not(:disabled) svg{transform:translateX(-3px);}

.lobby-hint{
  margin-top:var(--s4);

/* ==================== GAME ==================== */
.game-root{
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  background:#0A0D1B; position:relative; isolation:isolate;
}
.game-root::before{

}

.game-header{

}
.game-header-right{display:flex; align-items:center; gap:var(--s2); flex-shrink:0;}
.game-room-tag{

.game-room-tag b{

}

.game-timer{

  flex-shrink:0;
}
.game-timer-bar{
  position:relative; height:5px; width:100%;

}
.game-timer-fill{
  position:absolute; inset:0;
  background:linear-gradient(90deg, #8B5CF6 0%, #6C6BFF 55%, #A8A6FF 100%);

  transform-origin:right center; transform:scaleX(1);
  transition:transform .25s linear, background .4s, box-shadow .4s;
  box-shadow:0 0 14px rgba(108,107,255,.45);
}
.game-timer.warn .game-timer-fill{

}
.game-timer-meta{
  display:flex; align-items:center; justify-content:space-between;

}
.game-timer-meta .left{display:flex; align-items:center; gap:var(--s3); min-width:0;}
.game-timer-meta .right{display:flex; align-items:center; gap:var(--s2); flex-shrink:0;}
.game-round{display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}

.round-dots{display:inline-flex; gap:3px; margin-inline-start:2px;}
.round-dots span{width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.15); transition:background .3s;}

.game-turn-info{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.game-turn-info b{color:var(--text); font-weight:800;}
.game-time-text{
  font-weight:900; font-size:14px; color:var(--text);
  font-variant-numeric:tabular-nums;
  padding:3px 10px;

}
@media (max-width:640px){
  .game-timer{padding:10px var(--s4) 8px;}

.game-body{
  flex:1; width:100%; max-width:820px; margin:0 auto;

}

  .game-body{padding:var(--s4) var(--s4) var(--s5); gap:var(--s3);}
}

.player-strip{
  display:flex; gap:var(--s2);

}

.player-card{
  flex:0 0 auto; min-width:104px;

  border:1.5px solid rgba(255,255,255,.07);

}
.player-card .player-badge{
  position:absolute; top:-6px; right:-6px;
  width:22px; height:22px;

}
.player-card .player-avatar{

.player-card .player-name{

}

}
.player-card.drawing .player-badge{

}
@keyframes pulseBadge{0%,100%{transform:scale(1);} 50%{transform:scale(1.12);}}
.player-card.correct{background:rgba(46,212,122,.1); border-color:rgba(46,212,122,.4);}
.player-card.correct .player-score{color:var(--green);}

}

  0%,100%{box-shadow:0 0 0 1px rgba(255,84,112,.15) inset;}
  50%{box-shadow:0 0 14px rgba(255,84,112,.4), 0 0 0 1px rgba(255,84,112,.35) inset;}

.board-area{display:flex; flex-direction:column; gap:var(--s3);}

.word-display{
  text-align:center; font-size:22px; font-weight:900;
  min-height:32px; display:flex; align-items:center; justify-content:center;
  letter-spacing:.5px;
}
.word-display .actual{
  color:var(--pink);
  text-shadow:0 0 20px rgba(255,111,160,.4);
}
.word-display .letter-boxes{display:flex; gap:6px; justify-content:center;}
.word-display .letter-box{

}

.canvas-container{position:relative;}
canvas#board{

  box-shadow:0 30px 60px -30px rgba(0,0,0,.85);
}

.toolbar{
  display:none; align-items:center; justify-content:center;

}
.toolbar-divider{width:1px; height:18px; background:rgba(255,255,255,.1);}
.swatches, .sizes{display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:center;}
.swatch{
  width:22px; height:22px; border-radius:50%;

}

.size-btn{

}

.tool-actions{display:flex; gap:4px;}
.tool-actions button{
  padding:7px; border-radius:9px;

  transition:background .15s, color .15s;
  font-family:inherit;
}
.tool-actions button:hover{background:rgba(255,255,255,.05); color:var(--text);}
.tool-actions button svg{width:16px; height:16px;}

.guess-area{display:flex; flex-direction:column; gap:var(--s3);}
.chat-strip{
  display:flex; flex-direction:column; gap:6px;
  max-height:88px; overflow-y:auto;
  scrollbar-width:thin;
}
.chat-strip:empty{display:none;}
.chat-msg{
  font-size:12.5px; font-weight:600;
  padding:6px 12px;
  background:rgba(255,255,255,.03);
  border-radius:8px; color:var(--text-soft);
  line-height:1.5;
}
.chat-msg b{color:var(--text); font-weight:800;}
.chat-msg.correct{
  background:rgba(46,212,122,.1);
  border:1px solid rgba(46,212,122,.28);
  color:var(--green); font-weight:700;
  display:flex; align-items:center; justify-content:space-between; gap:var(--s2);
}
.chat-msg.correct .ok-ic{
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--green); color:#04140F;
  width:16px; height:16px; border-radius:50%;
  flex-shrink:0;
}
.chat-msg.correct .ok-ic svg{width:10px; height:10px; stroke-width:3;}
.chat-msg.msgIn{animation:msgSlide .25s ease both;}
@keyframes msgSlide{from{opacity:0; transform:translateX(10px);} to{opacity:1; transform:translateX(0);}}

.guess-options{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:var(--s2);
}
.guess-options:empty{display:none;}
@media (max-width:640px){
  .guess-options{grid-template-columns:repeat(2, 1fr);}
}
.guess-option-btn{
  font-family:inherit; font-weight:700; font-size:13.5px;
  padding:13px 8px;
  background:rgba(255,255,255,.03);
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:12px;
  color:var(--text-soft);
  cursor:pointer;
  transition:background .2s, color .2s, border-color .2s, box-shadow .2s, transform .12s;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.guess-option-btn:hover:not(:disabled){
  color:var(--text);
  background:rgba(108,107,255,.1);
  border-color:rgba(108,107,255,.35);
}
.guess-option-btn:active:not(:disabled){transform:scale(.97);}
.guess-option-btn:disabled{cursor:default; opacity:.4;}
.guess-option-btn.picked-pending{
  background:rgba(108,107,255,.14);
  color:#A8A6FF;
  border-color:rgba(108,107,255,.55);
  opacity:1;
  box-shadow:0 0 14px rgba(108,107,255,.25);
}
.guess-option-btn.picked-correct{
  background:rgba(46,212,122,.2) !important;
  color:var(--green) !important;
  border-color:var(--green) !important;
  border-width:2px !important;
  opacity:1 !important;
  box-shadow:0 0 16px rgba(46,212,122,.35) !important;
}
.guess-option-btn.picked-wrong{
  background:rgba(255,84,112,.22) !important;
  color:#FF8A9B !important;
  border-color:var(--coral) !important;
  border-width:2px !important;
  opacity:1 !important;
  box-shadow:0 0 16px rgba(255,84,112,.4) !important;
  animation:wrongShake .4s ease;
}
@keyframes wrongShake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-4px);}
  75%{transform:translateX(4px);}
}
.guess-waiting-note{
  grid-column:1 / -1;
  text-align:center;
  font-size:12px; font-weight:600;
  color:var(--text-soft);
  padding:var(--s2) 0;
}

.turn-dialog{
  position:fixed; inset:0;

}

.turn-dialog-card{

}
.td-body{display:flex; flex-direction:column; gap:6px;}

.td-word--small{font-size:22px; opacity:.7;}

}
.td-progress-fill{

}

.rc-icon-wrap svg{width:32px;height:32px;}

/* ============================= SOUND ENGINE (Web Audio API) ============================= */
const SFX = {
  ctx:null, master:null, sfxGain:null, musicGain:null,
  enabled:true, musicTimer:null,

  boot(){
    if(this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.enabled ? 0.95 : 0;
      this.master.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.9;
      this.sfxGain.connect(this.master);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.3;
      this.musicGain.connect(this.master);
    }catch(e){ this.ctx = null; }
  },
  resume(){ if(this.ctx && this.ctx.state === 'suspended'){ try{ this.ctx.resume(); }catch(e){} } },
  setEnabled(v){
    this.enabled = v;
    if(this.master) this.master.gain.value = v ? 0.95 : 0;
    if(!v) this.stopMusic();
  },

  tone(freq, dur, opt){
    if(!this.ctx || !this.enabled) return;
    opt = opt || {};
    const t = this.ctx.currentTime + (opt.d || 0);
    try{
      const o = this.ctx.createOscillator();
      o.type = opt.t || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if(opt.to) o.frequency.exponentialRampToValueAtTime(Math.max(20,opt.to), t + dur);
      const g = this.ctx.createGain();
      const v = opt.v != null ? opt.v : 0.28;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + (opt.attack || 0.012));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.sfxGain);
      o.start(t); o.stop(t + dur + 0.03);
      /* thin detuned layer for extra body/sparkle */
      if(opt.layer){
        const o2 = this.ctx.createOscillator();
        o2.type = opt.t || 'sine';
        o2.frequency.setValueAtTime(freq * (opt.layerRatio || 2.005), t);
        const g2 = this.ctx.createGain();
        g2.gain.setValueAtTime(0.0001, t);
        g2.gain.exponentialRampToValueAtTime(v * 0.5, t + (opt.attack || 0.012));
        g2.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o2.connect(g2); g2.connect(this.sfxGain);
        o2.start(t); o2.stop(t + dur + 0.03);
      }
    }catch(e){}
  },

  noise(dur, opt){
    if(!this.ctx || !this.enabled) return;
    opt = opt || {};
    try{
      const t = this.ctx.currentTime + (opt.d || 0);
      const sr = this.ctx.sampleRate;
      const bl = Math.max(1, Math.floor(sr * dur));
      const b = this.ctx.createBuffer(1, bl, sr);
      const d = b.getChannelData(0);
      for(let i=0;i<bl;i++) d[i] = (Math.random()*2-1) * (1 - i/bl);
      const s = this.ctx.createBufferSource(); s.buffer = b;
      const f = this.ctx.createBiquadFilter();
      f.type = opt.filter || 'bandpass';
      f.frequency.value = opt.freq || 1500;
      f.Q.value = opt.q || 1;
      const g = this.ctx.createGain();
      g.gain.value = opt.v != null ? opt.v : 0.2;
      s.connect(f); f.connect(g); g.connect(this.sfxGain);
      s.start(t); s.stop(t + dur + 0.02);
    }catch(e){}
  },

  /* ---- actual effects: punchier, layered, and louder than before ---- */
  click(){ this.boot(); this.resume();
    this.tone(880, 0.06, {t:'square', v:0.22, attack:0.004});
    this.noise(0.02, {filter:'highpass', freq:4000, v:0.06});
  },
  clickSoft(){ this.boot(); this.resume(); this.tone(620, 0.05, {t:'sine', v:0.16}); },
  select(){ this.boot(); this.resume();
    this.tone(587.33, 0.08, {t:'triangle', v:0.24, layer:true});
    this.tone(880, 0.1, {t:'triangle', v:0.2, d:0.05, layer:true});
  },
  optionPick(){ this.boot(); this.resume();
    this.tone(740, 0.07, {t:'triangle', v:0.22});
    this.tone(1108.73, 0.1, {t:'triangle', v:0.2, d:0.045});
  },
  pencil(){ this.boot(); this.resume(); this.noise(0.045, {filter:'highpass', freq:2800, v:0.09}); },
  eraser(){ this.boot(); this.resume(); this.noise(0.08, {filter:'bandpass', freq:700, q:0.8, v:0.1}); },
  correct(){ this.boot(); this.resume();
    [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((n,i)=> this.tone(n, 0.18, {t:'triangle', v:0.3, d:i*0.055, layer:true}));
    this.noise(0.12, {filter:'highpass', freq:6000, v:0.08, d:0.02});
  },
  wrong(){ this.boot(); this.resume();
    this.tone(280, 0.14, {t:'sawtooth', v:0.26});
    this.tone(180, 0.28, {t:'sawtooth', v:0.24, d:0.11, to:90});
    this.noise(0.1, {filter:'lowpass', freq:400, v:0.1, d:0.1});
  },
  tick(){ this.boot(); this.resume(); this.tone(1300, 0.04, {t:'square', v:0.18}); },
  urgentTick(){ this.boot(); this.resume();
    this.tone(1700, 0.05, {t:'square', v:0.24});
    this.tone(1700, 0.05, {t:'square', v:0.24, d:0.07});
  },
  timeUp(){ this.boot(); this.resume();
    this.tone(560, 0.16, {t:'sawtooth', v:0.28});
    this.tone(420, 0.16, {t:'sawtooth', v:0.28, d:0.15});
    this.tone(280, 0.5,  {t:'sawtooth', v:0.28, d:0.3, to:80});
  },
  dialogIn(){ this.boot(); this.resume(); this.tone(400, 0.18, {t:'sine', v:0.18, to:1000}); },
  dialogOut(){ this.boot(); this.resume(); this.tone(1000, 0.16, {t:'sine', v:0.16, to:380}); },
  yourTurn(){ this.boot(); this.resume();
    [523.25, 659.25, 783.99, 1046.50].forEach((n,i)=> this.tone(n, 0.22, {t:'triangle', v:0.34, d:i*0.09, layer:true}));
  },
  turnStart(){ this.boot(); this.resume();
    [659.25, 783.99, 1046.50].forEach((n,i)=> this.tone(n, 0.16, {t:'triangle', v:0.26, d:i*0.07}));
  },
  gameStart(){ this.boot(); this.resume();
    [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((n,i)=> this.tone(n, 0.24, {t:'triangle', v:0.32, d:i*0.08, layer:true}));
    this.tone(130.81, 0.5, {t:'sawtooth', v:0.14});
  },
  victory(){ this.boot(); this.resume();
    [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50, 1318.51, 1567.98, 2093.00]
      .forEach((n,i)=> this.tone(n, 0.26, {t:'triangle', v:0.36, d:i*0.1, layer:true}));
    this.tone(130.81, 1.0, {t:'sawtooth', v:0.16, d:0.05});
  },

  /* ---- ambient music: two distinct tracks, switched by screen ---- */
  currentTrack: null,
  startMusic(track){
    track = track || 'game';
    this.boot(); this.resume();
    if(!this.ctx || !this.enabled) return;
    if(this.musicTimer && this.currentTrack === track) return;
    this.stopMusic();
    this.currentTrack = track;
    if(track === 'menu') this._startMenuLoop();
    else this._startGameLoop();
  },
  stopMusic(){
    if(this.musicTimer){ clearInterval(this.musicTimer); this.musicTimer = null; }
    this.currentTrack = null;
  },

  /* upbeat arcade loop for the drawing/game screen — quick, playful, syncopated */
  _startGameLoop(){
    const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
    const melody = [4, 6, 4, 2, 0, 2, 4, 5, 6, 4, 6, 4, 5, 4, 2, 0, 2];
    const bass = [0, 0, 3, 3, 4, 4, 0, 0];
    let step = 0;
    const play = ()=>{
      if(!this.enabled || !this.ctx) return;
      const n = notes[melody[step % melody.length]];
      this.musicTone(n, 0.26, 0.11, 'triangle');
      if(step % 2 === 0){
        const bn = notes[bass[Math.floor(step/2) % bass.length]] / 4;
        this.musicTone(bn, 0.48, 0.08, 'sawtooth');
      }
      if(step % 4 === 2) this.musicHat();
      step++;
    };
    play();
    this.musicTimer = setInterval(play, 210);
  },

  /* warm, friendly bounce for home/lobby screens — slower, bell-like, relaxed */
  _startMenuLoop(){
    const notes = [293.66, 349.23, 392.00, 440.00, 523.25, 587.33, 659.25];
    const melody = [0, 2, 4, 2, 5, 4, 2, 0, 1, 3, 4, 3, 2, 4, 0, 2];
    const bass = [0, 0, 3, 3];
    let step = 0;
    const play = ()=>{
      if(!this.enabled || !this.ctx) return;
      const n = notes[melody[step % melody.length]];
      this.musicTone(n, 0.42, 0.085, 'triangle', 1500);
      if(step % 4 === 0){
        const bn = notes[bass[(step/4) % bass.length]] / 4;
        this.musicTone(bn, 0.9, 0.06, 'sine', 900);
      }
      if(step % 8 === 6) this.musicHat(0.035);
      step++;
    };
    play();
    this.musicTimer = setInterval(play, 300);
  },
  musicTone(f, dur, v, wave, cutoff){
    if(!this.ctx || !this.enabled) return;
    try{
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      o.type = wave || 'triangle'; o.frequency.value = f;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      const fl = this.ctx.createBiquadFilter();
      fl.type = 'lowpass'; fl.frequency.value = cutoff || 2200;
      o.connect(fl); fl.connect(g); g.connect(this.musicGain);
      o.start(t); o.stop(t + dur + 0.05);
    }catch(e){}
  },
  musicHat(v){
    if(!this.ctx || !this.enabled) return;
    try{
      const t = this.ctx.currentTime;
      const sr = this.ctx.sampleRate;
      const bl = Math.floor(sr * 0.03);
      const b = this.ctx.createBuffer(1, bl, sr);
      const d = b.getChannelData(0);
      for(let i=0;i<bl;i++) d[i] = (Math.random()*2-1) * (1 - i/bl);
      const s = this.ctx.createBufferSource(); s.buffer = b;
      const f = this.ctx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 6000;
      const g = this.ctx.createGain(); g.gain.value = v != null ? v : 0.06;
      s.connect(f); f.connect(g); g.connect(this.musicGain);
      s.start(t);
    }catch(e){}
  }
};

/* init audio on first user gesture */
(function(){
  const kick = ()=>{ SFX.boot(); SFX.resume(); };
  document.addEventListener('pointerdown', kick, {once:true});
  document.addEventListener('keydown', kick, {once:true});
  // restore mute preference
  try{
    const saved = localStorage.getItem('khatkhati_muted') === '1';
    if(saved) SFX.enabled = false;
  }catch(e){}
})();

function toast(msg, ms){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=> t.classList.remove('show'), ms||2600);
}
function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function genLocalId(prefix){ return (prefix||'id')+'_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function faNum(n){
  const map = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
  return n.toString().split('').map(c=> map[c]!==undefined?map[c]:c).join('');
}
const PALETTE = ['#FF6A5B','#2FB6A6','#7C83FD','#FFC857','#FF8FB1','#59C36A','#5AA9E6','#C77DFF'];
function colorFor(idx){ return PALETTE[idx % PALETTE.length]; }

function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).then(()=> true).catch(()=> legacyCopy(text));
  }
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0;pointer-events:none;';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

/* ============================= WEBSOCKET ============================= */
let ws = null;
let wsReady = false;
let reconnectAttempt = 0;
let reconnectTimer = null;
let intentionalClose = false;
const pendingMsgs = [];

function saveSession(code, playerId){
  try{ sessionStorage.setItem('khatkhati_session', JSON.stringify({code, playerId})); }catch(e){}
}
function loadSession(){
  try{ return JSON.parse(sessionStorage.getItem('khatkhati_session')||'null'); }catch(e){ return null; }
}
function clearSession(){
  try{ sessionStorage.removeItem('khatkhati_session'); }catch(e){}
}

function connectWs(){
  clearTimeout(reconnectTimer);
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host);
  ws.addEventListener('open', ()=>{
    wsReady = true;
    reconnectAttempt = 0;
    $('#connBanner')?.classList.remove('show');
    const session = loadSession();
    if(session && session.code && session.playerId){
      ws.send(JSON.stringify({type:'rejoin', code:session.code, playerId:session.playerId}));
    }
    while(pendingMsgs.length){
      const m = pendingMsgs.shift();
      try{ ws.send(JSON.stringify(m)); }catch(e){}
    }
    if(isReconnectDialogOpen()){
      if(S.rcAutoResume){
        S.rcAutoResume = false;
        hideReconnectDialog();
      } else {
        setReconnectDialogReady();
      }
    }
  });
  ws.addEventListener('message', (ev)=>{
    let msg; try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    onServerMessage(msg);
  });
  ws.addEventListener('close', ()=>{
    wsReady = false;
    if(intentionalClose) return;
    if(S.code && S.screen !== 'home') showReconnectDialog();
    reconnectAttempt++;
    const delay = Math.min(1000 * Math.pow(1.6, reconnectAttempt), 8000);
    reconnectTimer = setTimeout(connectWs, delay);
  });
  ws.addEventListener('error', ()=>{ try{ ws.close(); }catch(e){} });
}
function sendMsg(type, data){
  const payload = Object.assign({type}, data||{});
  if(!ws || ws.readyState !== 1){
    // Queue instead of dropping silently — flushed once the socket (re)connects.
    pendingMsgs.push(payload);
    if(!ws || ws.readyState === 3){ connectWs(); }
    return;
  }
  ws.send(JSON.stringify(payload));
}
connectWs();

/* Reconnect immediately when the browser/tab comes back online or foreground,
   instead of waiting for the backoff timer. */
window.addEventListener('online', ()=>{

    connectWs();
  }
});
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && !wsReady){
    if(S.code && S.screen !== 'home') showReconnectDialog();
    connectWs();
  }
  if(document.visibilityState === 'hidden'){
    if(SFX.musicTimer){ SFX._pausedTrack = SFX.currentTrack; SFX.stopMusic(); }
    if(SFX.ctx && SFX.ctx.state === 'running'){ try{ SFX.ctx.suspend(); }catch(e){} }
  } else if(document.visibilityState === 'visible'){
    if(SFX.ctx && SFX.ctx.state === 'suspended' && SFX.enabled){ try{ SFX.ctx.resume(); }catch(e){} }
    if(SFX._pausedTrack && SFX.enabled){ SFX.startMusic(SFX._pausedTrack); SFX._pausedTrack = null; }
  }
});

/* ============================= ROUTER ============================= */
function goTo(screen){
  if(S.screen === screen) return false;
  const leavingGame = (S.screen === 'game' && screen !== 'game');
  S.screen = screen;
  S.mounting = true;
  const doMount = ()=>{
    app.innerHTML = '';
    if(screen==='home') mountHome();
    else if(screen==='lobby') mountLobby();
    else if(screen==='game') mountGame();
    else if(screen==='final') mountFinal();
    S.mounting = false;
    requestAnimationFrame(()=> requestAnimationFrame(()=> app.classList.remove('screen-exit')));
  };
  if(leavingGame) SFX.stopMusic();
  if(app.children.length){
    app.classList.add('screen-exit');
    setTimeout(doMount, 170);
  } else doMount();
  if(screen === 'final') SFX.stopMusic();
  return true;
}

/* ============================= SERVER MESSAGE DISPATCH ============================= */
function onServerMessage(msg){
  switch(msg.type){
    case 'joined':
      S.code = msg.code; S.me.id = msg.playerId; S.isHost = msg.isHost;
      S.lobbyAnimated = new Set();
      saveSession(msg.code, msg.playerId);
      if(S.screen !== 'lobby' && S.screen !== 'game' && S.screen !== 'final') goTo('lobby');
      break;
    case 'errorMsg':
      SFX.wrong();
      toast(msg.message);
      if(msg.fatal){
        clearSession();
        S.code = null; S.me.id = null; S.isHost = false; S.meta = null;
        goTo('home');
      }
      break;
    case 'roomClosed':
      clearSession();
      S.code = null; S.me.id = null; S.isHost = false; S.meta = null;
      toast('اتاق توسط مدیر بسته شد');
      goTo('home');
      break;
    case 'state': {
      const prevStatus = S.meta ? S.meta.status : null;
      const prevSeq = S.meta ? S.meta.turnSeq : null;
      S.meta = msg.meta; S.players = msg.players;
      S.isHost = msg.meta.hostId === S.me.id;
      let changed;
      if(msg.meta.status === 'lobby') changed = goTo('lobby');
      else if(msg.meta.status === 'final') changed = goTo('final');
      else changed = goTo('game');
      if(!changed && !S.mounting){
        if(S.screen === 'lobby') renderLobbyDynamic();
        if(S.screen === 'game') updateGameDynamic(prevStatus, prevSeq);
        if(S.screen === 'final') renderFinalDynamic();
      }
      break;
    }
    case 'chatMessage':
      appendChatMessage(msg);
      break;
    case 'canvasSnapshot':
      S.localStrokes = msg.strokes || [];
      S.remoteStrokes = {};
      redrawAll(msg.strokes || []);
      break;
    case 'strokeStart': {
      const stroke = {id:msg.id, tool:msg.tool, color:msg.color, size:msg.size, points:[msg.point]};
      S.remoteStrokes[msg.id] = stroke;
      drawSegment(stroke, 0, 0);
      break;
    }
    case 'strokePoint': {
      const st = S.remoteStrokes[msg.id];
      if(st && msg.point){ st.points.push(msg.point); drawSegment(st, st.points.length-2, st.points.length-1); }
      break;
    }
    case 'strokeEnd':
      delete S.remoteStrokes[msg.id];
      break;
  }
}

  if(countEl) countEl.textContent = faNum(players.length);

      const isNew = !S.lobbyAnimated.has(p.id);

  }

  const roundsChips = $('#roundsChips');

    ).join('');
  }
  const timeChips = $('#timeChips');
  const times = [30,45,60,90,120];
  if(timeChips){
    timeChips.innerHTML = times.map(t=>
      `<button class="lobby-chip ${S.meta.turnSeconds===t?'active':''} ${S.isHost?'':'readonly'}" data-t="${t}">${faNum(t)} ثانیه</button>`
    ).join('');
  }

  const startBtn = $('#startBtn');
  const hostHint = $('#hostHint');
  if(S.isHost){
    $$('.lobby-chip[data-r]').forEach(b=> b.onclick = ()=> sendMsg('updateSettings', {rounds: parseInt(b.dataset.r)}));
    $$('.lobby-chip[data-t]').forEach(b=> b.onclick = ()=> sendMsg('updateSettings', {turnSeconds: parseInt(b.dataset.t)}));
    if(startBtn){ startBtn.style.display = ''; startBtn.disabled = players.length < 2; }
    if(hostHint){
      hostHint.style.display = players.length < 2 ? 'block' : 'none';
      hostHint.textContent = 'برای شروع حداقل ۲ بازیکن لازم است';
    }
  } else {
    if(startBtn) startBtn.style.display = 'none';
    if(hostHint){
      hostHint.style.display = 'block';
      hostHint.textContent = 'منتظر بمان تا میزبان بازی را شروع کند...';
    }
  }
}

/* ============================= GAME SCREEN ============================= */
function mountGame(){
  app.innerHTML = `
  <div class="game-root">
    ${headerHTML(true)}

    <div class="game-timer" id="timerBar">
      <div class="game-timer-bar">
        <div class="game-timer-fill" id="timerFill"></div>
      </div>
      <div class="game-timer-meta">
        <div class="left">
          <span class="game-round">دور <b id="roundNow">۱</b>/<span id="roundTotal">۳</span><span class="round-dots" id="roundDots"></span></span>
          <span class="game-turn-info" id="turnInfo">نوبت رسم: —</span>
        </div>
        <div class="right">
          <span class="game-time-text" id="timerTxt">--:--</span>
        </div>
      </div>
    </div>

    <div class="game-body">
      <div class="player-strip" id="playerStrip"></div>

      <div class="board-area">
        <div class="word-display" id="wordDisplay"></div>
        <div class="canvas-container">
          <canvas id="board" width="800" height="600"></canvas>
        </div>
        <div class="toolbar" id="toolbar" style="display:none;">
          <div class="swatches" id="swatches"></div>
          <div class="toolbar-divider"></div>
          <div class="sizes" id="sizes"></div>
          <div class="toolbar-divider"></div>
          <div class="tool-actions">
            <button type="button" id="eraserBtn" title="پاک‌کن">${icon('eraser',16)}</button>
            <button type="button" id="undoBtn" title="واگرد">${icon('undo',16)}</button>
            <button type="button" id="clearBtn" title="پاک کردن همه">${icon('trash',16)}</button>
          </div>
        </div>
      </div>

      <div class="guess-area">
        <div class="chat-strip" id="chatList"></div>
        <div class="guess-options" id="guessOptions"></div>
      </div>
    </div>
  </div>

  <div class="turn-dialog" id="turnDialog" style="display:none;"></div>`;

  setupCanvas();
  setupToolbar();
  S.lastTurnSeq = null;
  S.pickedOption = null;
  S.dialogKey = null;
  S.lastTickSec = null;
  S.lastMyAnswerKey = null;
  updateGameDynamic(null, null);
  startTimerLoop();

  /* start background music */
  if(SFX.enabled) SFX.startMusic('game');
}

function startTimerLoop(){
  clearInterval(startTimerLoop._t);
  startTimerLoop._t = setInterval(updateTimerDisplay, 250);
}
function updateTimerDisplay(){
  if(S.screen !== 'game' || !S.meta) return;
  const timerTxt = $('#timerTxt');
  const timerFill = $('#timerFill');
  const timerBar = $('#timerBar');
  if(!timerTxt || !timerFill) return;
  if(S.meta.status === 'drawing'){
    const total = (S.meta.turnSeconds || 60) * 1000;
    const left = Math.max(0, S.meta.turnEndAt - Date.now());
    const pct = Math.max(0, Math.min(1, left / total));
    const secs = Math.ceil(left/1000);
    const mm = Math.floor(secs/60), ss = secs%60;
    timerTxt.textContent = faNum(mm)+':'+faNum(ss<10?'0'+ss:ss);
    timerFill.style.transform = 'scaleX('+pct+')';
    const warn = secs <= 10;
    if(timerBar) timerBar.classList.toggle('warn', warn);

    /* tick sounds in the last 10 seconds */
    if(secs <= 10 && secs > 0 && secs !== S.lastTickSec){
      S.lastTickSec = secs;
      if(secs <= 3) SFX.urgentTick(); else SFX.tick();
    }
  } else {
    timerTxt.textContent = '--:--';
    timerFill.style.transform = 'scaleX(1)';
    if(timerBar) timerBar.classList.remove('warn');
    S.lastTickSec = null;
  }
}

function updateGameDynamic(prevStatus, prevSeq){
  const meta = S.meta;
  const players = S.players;
  if(!meta) return;
  const drawer = players[meta.currentDrawerId];
  const iAmDrawer = meta.currentDrawerId === S.me.id;

  /* ---- state transition sounds ---- */
  if(prevStatus !== meta.status){
    if(prevStatus === 'drawing' && meta.status === 'turnEnd'){
      /* is it a time-up or all-guessed end? we play timeUp if drawer hasn't been scored for correct */
      /* simple heuristic: play timeUp sound always; correct sounds already played per correct guess */
      SFX.timeUp();
    }
    if(prevStatus === 'lobby' && meta.status === 'turnEnd' && meta.isPreGame){
      SFX.gameStart();
    }
    if(meta.status === 'final' && prevStatus !== 'final'){
      SFX.stopMusic();
      SFX.victory();
    }
    /* new drawing started (dialog closed, game begins) */
    if(meta.status === 'drawing' && prevStatus === 'turnEnd'){
      if(iAmDrawer) SFX.turnStart();
      else SFX.clickSoft();
    }
  }

  /* ---- wrong guess local sound ---- */
  const curMyAnswer = meta.myAnswer;
  const curMyKey = curMyAnswer ? (curMyAnswer.word + '_' + (curMyAnswer.correct?'c':'w')) : null;
  if(curMyKey && curMyKey !== S.lastMyAnswerKey){
    if(!curMyAnswer.correct) SFX.wrong();
  }
  S.lastMyAnswerKey = curMyKey;

  $('#roundNow').textContent = faNum(meta.currentRound);
  $('#roundTotal').textContent = faNum(meta.rounds);
  $('#roundDots').innerHTML = Array.from({length: meta.rounds||1}).map((_,i)=> `<span class="${i < meta.currentRound ? 'done':''}"></span>`).join('');
  $('#turnInfo').innerHTML = `نوبت رسم: <b>${escapeHtml(drawer?drawer.name:'')}</b>`;
  updateTimerDisplay();

  if(meta.turnSeq !== S.lastTurnSeq){
    clearCanvasLocal();
    S.localStrokes = [];
    S.remoteStrokes = {};
    $('#chatList').innerHTML = '';
    S.lastTurnSeq = meta.turnSeq;
    S.pickedOption = null;
    S.lastTickSec = null;
  }

  const wd = $('#wordDisplay');
  if(meta.status === 'drawing'){
    if(iAmDrawer){
      wd.innerHTML = `<span class="actual">${escapeHtml(meta.currentWord||'')}</span>`;
    } else {
      wd.innerHTML = '';
    }
  } else {
    wd.innerHTML = '';
  }

  const toolbar = $('#toolbar');
  const guessOptions = $('#guessOptions');
  const canvas = $('#board');

  if(meta.status === 'drawing'){
    toolbar.style.display = iAmDrawer ? 'flex' : 'none';
    canvas.classList.toggle('canvas-disabled', !iAmDrawer);
    const myAnswer = meta.myAnswer;
    if(iAmDrawer){
      guessOptions.innerHTML = '';
    } else if(myAnswer || S.pickedOption){
      const pickedWord = myAnswer ? myAnswer.word : S.pickedOption;
      guessOptions.innerHTML = (meta.options||[]).map(w=>{
        let cls = 'guess-option-btn';
        if(w === pickedWord){
          if(myAnswer) cls += myAnswer.correct ? ' picked-correct' : ' picked-wrong';
          else cls += ' picked-pending';
        }
        return `<button type="button" class="${cls}" disabled data-w="${escapeHtml(w)}">${escapeHtml(w)}</button>`;
      }).join('') + (myAnswer
        ? `<div class="guess-waiting-note">${myAnswer.correct ? 'درست حدس زدی! منتظر بمان...' : 'اشتباه حدس زدی! برای این نوبت دیگر نمی‌توانی حدس بزنی.'}</div>`
        : '');
    } else {
      guessOptions.innerHTML = (meta.options||[]).map(w=>
        `<button type="button" class="guess-option-btn" data-w="${escapeHtml(w)}">${escapeHtml(w)}</button>`
      ).join('');
      $$('.guess-option-btn', guessOptions).forEach(b=> b.onclick = ()=>{
        SFX.optionPick();
        S.pickedOption = b.dataset.w;
        sendMsg('guess', {word: b.dataset.w});
        updateGameDynamic();
      });
    }
  } else if(meta.status === 'turnEnd'){
    toolbar.style.display = 'none';
    guessOptions.innerHTML = '';
    canvas.classList.add('canvas-disabled');
  }

  const wrongIds = meta.wrongIds || [];
  const sorted = Object.values(players).sort((a,b)=> b.score - a.score);
  const stripEl = $('#playerStrip');
  if(stripEl){
    stripEl.innerHTML = sorted.map(p=>{
      const isDrawingNow = p.id === meta.currentDrawerId && meta.status==='drawing';
      const guessedNow = (meta.guessedIds||[]).indexOf(p.id) !== -1;
      const wrongNow = wrongIds.indexOf(p.id) !== -1;
      const isMe = p.id === S.me.id;
      let cls = 'player-card';
      if(isDrawingNow) cls += ' drawing';
      else if(guessedNow) cls += ' correct';
      else if(wrongNow) cls += ' wrong';
      if(isMe) cls += ' me';
      if(!p.connected) cls += ' offline';
      let badge = '';
      if(isDrawingNow) badge = icon('pencil',12);
      else if(guessedNow) badge = icon('check',12);
      else if(wrongNow) badge = icon('x',12);
      return `<div class="${cls}">
        <div class="player-badge">${badge}</div>
        <div class="player-avatar" style="background:${colorFor(p.colorIdx)}">${escapeHtml((p.name||'?').slice(0,1))}</div>
        <div class="player-info">
          <div class="player-name">${escapeHtml(p.name)}</div>
          <div class="player-score">${faNum(p.score||0)}</div>
        </div>
      </div>`;
    }).join('');
  }

  updateTurnDialog(meta, players);
}

/* ============================= TURN DIALOG ============================= */
let turnDialogTimer = null;
function updateTurnDialog(meta, players){
  const dlg = $('#turnDialog');
  if(!dlg) return;

  if(meta.status !== 'turnEnd'){
    clearTimeout(turnDialogTimer);
    turnDialogTimer = null;
    if(dlg.style.display !== 'none'){
      dlg.style.display = 'none';
      dlg.dataset.key = '';
      S.dialogKey = null;
    }
    return;
  }

  const isPreGame = !!meta.isPreGame;
  const key = isPreGame
    ? 'pre-game-' + (meta.nextDrawerId || '')
    : ('end-' + meta.turnSeq + '-' + (meta.nextDrawerId || ''));

  if(dlg.dataset.key === key && (dlg.style.display !== 'none' || turnDialogTimer)) return;
  dlg.dataset.key = key;
  S.dialogKey = key;
  clearTimeout(turnDialogTimer);

  /* Give players ~3s to first see the green/red result on their avatar in the
     player strip before the turn-end dialog covers the screen. */
  turnDialogTimer = setTimeout(()=>{
    turnDialogTimer = null;
    renderTurnDialog(meta, players, isPreGame);
  }, 3000);
}

function renderTurnDialog(meta, players, isPreGame){
  const dlg = $('#turnDialog');
  if(!dlg) return;
  const myId = S.me.id;
  const nextDrawerId = meta.nextDrawerId;
  const nextDrawer = players[nextDrawerId];
  const iAmNextDrawer = nextDrawerId === myId;
  const nextDrawerName = escapeHtml(nextDrawer ? nextDrawer.name : '');

  /* dialog open sound; special fanfare if it's your turn to draw next */
  SFX.dialogIn();
  if(iAmNextDrawer){
    setTimeout(()=> SFX.yourTurn(), 120);
  }

  let title, bodyHTML;
  if(isPreGame){
    title = 'شروع بازی';
    if(iAmNextDrawer){
      bodyHTML = `
        <div class="td-line td-primary">تو نقاشی می‌کشی!</div>
        <div class="td-word">${escapeHtml(meta.nextWord||'')}</div>
        <div class="td-hint">آماده باش تا این کلمه رو بکشی</div>
      `;
    } else {
      bodyHTML = `
        <div class="td-line td-muted">نقاش اول:</div>
        <div class="td-name">${nextDrawerName}</div>
        <div class="td-hint">آماده باش تا شروع کنه</div>
      `;
    }
  } else {
    title = 'پایان نوبت';
    const correctWord = escapeHtml(meta.lastWordReveal || '');
    if(iAmNextDrawer){
      bodyHTML = `
        <div class="td-line td-muted">کلمه درست این بود:</div>
        <div class="td-word td-word--small">${correctWord}</div>
        <div class="td-divider"></div>
        <div class="td-line td-primary">تو نقاش بعدی هستی!</div>
        <div class="td-word">${escapeHtml(meta.nextWord||'')}</div>
        <div class="td-hint">آماده باش تا این کلمه رو بکشی</div>
      `;
    } else {
      bodyHTML = `
        <div class="td-line td-muted">کلمه درست این بود:</div>
        <div class="td-word td-word--small">${correctWord}</div>
        <div class="td-divider"></div>
        <div class="td-line td-muted">نقاش بعدی:</div>
        <div class="td-name">${nextDrawerName}</div>
      `;
    }
  }

  dlg.innerHTML = `
    <div class="turn-dialog-card">
      <div class="td-title">${escapeHtml(title)}</div>
      <div class="td-body">${bodyHTML}</div>
      <div class="td-progress"><div class="td-progress-fill" style="animation-duration:4s;"></div></div>
    </div>
  `;
  dlg.style.display = 'flex';
}

function appendChatMessage(g){
  const box = $('#chatList');
  if(!box) return;
  const div = document.createElement('div');
  if(g.kind === 'correct'){
    div.className = 'chat-msg correct msgIn';
    div.innerHTML = '<span>'+escapeHtml(g.name)+' درست حدس زد! (+'+faNum(g.points)+')</span><span class="ok-ic">'+icon('check',10)+'</span>';
    SFX.correct();
    fireConfetti(14, 1300);
  } else {
    div.className = 'chat-msg msgIn';
    div.innerHTML = `<b>${escapeHtml(g.name)}:</b> ${escapeHtml(g.text)}`;
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

/* ============================= CANVAS / DRAWING ============================= */
let ctx = null;
function setupCanvas(){
  const canvas = $('#board');
  ctx = canvas.getContext('2d');
  clearCanvasLocal();

  function toNorm(cx, cy){
    const r = canvas.getBoundingClientRect();
    return [ (cx-r.left)/r.width, (cy-r.top)/r.height ];
  }
  function isDrawerNow(){
    return S.meta && S.meta.status==='drawing' && S.meta.currentDrawerId === S.me.id;
  }
  function pos(e){ return toNorm(e.clientX, e.clientY); }
  function start(e){
    if(!isDrawerNow()) return;
    e.preventDefault();
    S.drawing = true;
    const [x,y] = pos(e);
    const id = genLocalId('s');
    S.curStrokeId = id;
    const stroke = { id, tool:S.tool.mode, color:S.tool.color, size:S.tool.size, points:[[x,y]] };
    S.localStrokes.push(stroke);
    drawSegment(stroke, 0, 0);
    if(S.tool.mode === 'eraser') SFX.eraser(); else SFX.pencil();
    sendMsg('strokeStart', {id, tool:S.tool.mode, color:S.tool.color, size:S.tool.size, point:[x,y]});
  }
  function move(e){
    if(!S.drawing || !isDrawerNow()) return;
    e.preventDefault();
    const [x,y] = pos(e);
    const stroke = S.localStrokes[S.localStrokes.length-1];
    if(!stroke) return;
    const pts = stroke.points;
    pts.push([x,y]);
    drawSegment(stroke, pts.length-2, pts.length-1);
    sendMsg('strokePoint', {id: stroke.id, point:[x,y]});
  }
  function end(){
    if(!S.drawing) return;
    S.drawing = false;
    if(S.curStrokeId) sendMsg('strokeEnd', {id: S.curStrokeId});
    S.curStrokeId = null;
  }
  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}

function drawSegment(stroke, i0, i1){
  const canvas = $('#board');
  if(!canvas || !ctx) return;
  const p0 = stroke.points[i0], p1 = stroke.points[i1];
  if(!p0||!p1) return;
  ctx.save();
  ctx.globalCompositeOperation = stroke.tool==='eraser' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = stroke.color;
  ctx.lineWidth = stroke.size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(p0[0]*canvas.width, p0[1]*canvas.height);
  ctx.lineTo(p1[0]*canvas.width, p1[1]*canvas.height);
  ctx.stroke();
  ctx.restore();
  if(stroke.points.length === 1){
    ctx.save();
    ctx.globalCompositeOperation = stroke.tool==='eraser' ? 'destination-out' : 'source-over';
    ctx.fillStyle = stroke.color;
    ctx.beginPath();
    ctx.arc(p0[0]*canvas.width, p0[1]*canvas.height, stroke.size/2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}
function redrawAll(strokes){
  const canvas = $('#board');
  if(!canvas || !ctx) return;
  ctx.save(); ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore();
  (strokes||[]).forEach(st=>{
    if(st.points.length <= 1){ drawSegment(st,0,0); return; }
    for(let i=0;i<st.points.length-1;i++) drawSegment(st,i,i+1);
  });
}
function clearCanvasLocal(){
  const canvas = $('#board');
  if(ctx && canvas){ ctx.save(); ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore(); }
}

function setupToolbar(){
  const colors = ['#22252B','#FF6A5B','#FFC857','#2FB6A6','#5AA9E6','#7C83FD','#FF8FB1','#59C36A','#8B5E34'];
  const sw = $('#swatches');
  sw.innerHTML = colors.map(c=> `<span class="swatch ${c===S.tool.color?'sel':''}" data-c="${c}" style="background:${c};"></span>`).join('');
  $$('.swatch', sw).forEach(el=> el.onclick = ()=>{
    S.tool.color = el.dataset.c; S.tool.mode = 'pen';
    $$('.swatch', sw).forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
    $('#eraserBtn').style.color = '';
    SFX.clickSoft();
  });

  const sizes = [3,7,14];
  const sizesEl = $('#sizes');
  sizesEl.innerHTML = sizes.map((s,i)=> `<button type="button" class="size-btn ${s===S.tool.size?'sel':''}" data-s="${s}"><span class="dot" style="width:${5+i*4}px;height:${5+i*4}px;"></span></button>`).join('');
  $$('.size-btn', sizesEl).forEach(el=> el.onclick = ()=>{
    S.tool.size = parseInt(el.dataset.s);
    $$('.size-btn', sizesEl).forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
  });

  $('#eraserBtn').onclick = ()=>{
    S.tool.mode = S.tool.mode==='eraser' ? 'pen' : 'eraser';
    $('#eraserBtn').style.color = S.tool.mode==='eraser' ? 'var(--coral)' : '';
  };
  $('#undoBtn').onclick = ()=>{ sendMsg('undo', {}); };
  $('#clearBtn').onclick = ()=>{ sendMsg('clearCanvas', {}); };
}

/* ============================= FINAL SCREEN ============================= */
function mountFinal(){
  app.innerHTML = `
  <div class="screen" style="min-height:100vh; padding:0 var(--s4) var(--s10); display:flex; flex-direction:column; align-items:center;">
    ${headerHTML(false)}
    <div class="wrap" style="max-width:480px;">
      <div class="brand"><h1 style="font-size:24px;">${icon('trophy',22)} نتیجه نهایی</h1></div>
      <div class="final-list" id="finalList"></div>
      <div class="final-actions" id="finalActions"></div>
    </div>
  </div>`;
  fireConfetti();
  renderFinalDynamic();
}
function renderFinalDynamic(){
  if(S.screen !== 'final' || !S.meta) return;
  const sorted = Object.values(S.players).sort((a,b)=> b.score-a.score);
  const rankColors = ['#FFB84D','#C7CCDD','#E8A87C'];
  $('#finalList').innerHTML = sorted.map((p,i)=> {
    const rankContent = i===0 ? icon('trophy',22) : faNum(i+1);
    const rankColor = rankColors[i] || 'var(--text-soft)';
    return `
    <div class="card final-row ${i===0?'r1':i===1?'r2':i===2?'r3':''} fadeUp" style="animation-delay:${i*80}ms">
      <span class="rank" style="color:${rankColor}">${rankContent}</span>
      <div class="avatar" style="background:${colorFor(p.colorIdx)}">${escapeHtml((p.name||'?').slice(0,1))}</div>
      <span class="nm">${escapeHtml(p.name)}</span>
      <span class="sc">${faNum(p.score||0)}</span>
    </div>`;
  }).join('');

  const actions = $('#finalActions');
  if(S.isHost){
    actions.innerHTML = `<button class="btn btn-primary" id="againBtn">بازی دوباره</button><button class="btn btn-ghost" id="exitBtn">خروج</button>`;
    $('#againBtn').onclick = ()=> sendMsg('playAgain', {});
  } else {
    actions.innerHTML = `<button class="btn btn-ghost" id="exitBtn">خروج</button>`;
  }
  $('#exitBtn').onclick = ()=>{
    sendMsg('leaveRoom', {});
    clearSession();
    S.code = null; S.me.id = null; S.isHost = false; S.meta = null;
    history.replaceState(null,'',location.pathname);
    goTo('home');
  };
}

function fireConfetti(count, duration){
  count = count || 60; duration = duration || 5200;
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  document.body.appendChild(layer);
  const colors = PALETTE;
  for(let i=0;i<count;i++){
    const d = document.createElement('div');
    d.className = 'confetti-piece';
    const size = 6+Math.random()*7;
    d.style.width = size+'px';
    d.style.height = (size*0.5)+'px';
    d.style.left = Math.random()*100+'vw';
    d.style.background = colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration = (Math.min(2.5,duration/1000)+Math.random()*1.2)+'s';
    d.style.animationDelay = (Math.random()*0.4)+'s';
    layer.appendChild(d);
  }
  setTimeout(()=> layer.remove(), duration+700);
}

/* ============================= BOOT ============================= */
goTo('home');
})();
