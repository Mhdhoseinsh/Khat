<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>خط‌خطی | بازی نقاشی و حدس آنلاین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D1B;
  --surface:#12162A;
  --surface-2:#1A2036;
  --border: rgba(255,255,255,.08);
  --border-strong: rgba(255,255,255,.16);
  --text:#EEF0FB;
  --text-soft:#8B92B4;
  --brand:#6C6BFF;
  --brand2:#8B5CF6;
  --amber:#FFB84D;
  --pink:#FF6FA0;
  --green:#2ED47A;
  --teal:#6C6BFF;
  --coral:#FF5470;
  --radius: 18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Vazirmatn',Tahoma,'Segoe UI',Arial,sans-serif;
  background:
    radial-gradient(900px 500px at 10% -5%, rgba(108,107,255,.16), transparent 60%),
    radial-gradient(800px 500px at 105% 8%, rgba(139,92,246,.14), transparent 55%),
    radial-gradient(700px 500px at 50% 115%, rgba(108,107,255,.08), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  min-height:100%;
  overflow-x:hidden;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}
button{font-family:inherit;}
input,button,select,textarea{font-size:16px;}
.screen{min-height:100vh; padding:0 16px 40px; display:flex; flex-direction:column; align-items:center;}
.wrap{width:100%; max-width:960px;}

/* ---------- topbar ---------- */
.topbar{
  width:100%; max-width:1180px; margin:0 auto 26px; padding:16px 4px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
}
.topbar-logo{display:flex; align-items:center; gap:8px; font-weight:900; font-size:19px; color:var(--text); flex-shrink:0;}
.topbar-logo .pencil{font-size:19px;}
.topbar-logo .g{background:linear-gradient(135deg,var(--brand),var(--brand2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.topbar-nav{display:flex; align-items:center; gap:26px; font-weight:700; font-size:14.5px; color:var(--text-soft);}
.topbar-nav a{color:inherit; cursor:default;}
.topbar-nav a.active{color:var(--text);}
.topbar-room{display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px;}
.topbar-room .pub{font-size:11px; font-weight:700; color:var(--green); background:rgba(46,212,122,.14); border:1px solid rgba(46,212,122,.3); padding:3px 9px; border-radius:20px; display:inline-flex; align-items:center; gap:4px;}
.topbar-room .pub::before{content:"●"; font-size:8px;}
.topbar-user{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; flex-shrink:0;}
@media (max-width:640px){.topbar-nav{display:none;}}

/* ---------- buttons & inputs ---------- */
.btn{
  font-family:inherit; font-weight:700; font-size:16px; cursor:pointer;
  border:1.5px solid var(--border-strong); border-radius:14px; padding:13px 22px;
  background:var(--surface-2); color:var(--text);
  box-shadow:0 10px 24px -12px rgba(0,0,0,.7);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  -webkit-user-select:none; user-select:none;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4; cursor:not-allowed; filter:none;}
.btn:disabled:active{transform:none;}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#04140F; border-color:transparent; box-shadow:0 14px 30px -10px rgba(34,230,192,.5);}
.btn-coral{background:linear-gradient(135deg,var(--pink),#FF7A59); color:#1A0510; border-color:transparent; box-shadow:0 14px 30px -10px rgba(255,111,160,.45);}
.btn-yellow{background:linear-gradient(135deg,var(--amber),#FFD98A); color:#2B1B02; border-color:transparent; box-shadow:0 14px 30px -10px rgba(255,184,77,.4);}
.btn-ghost{background:transparent; box-shadow:none;}
.btn-sm{padding:8px 14px; font-size:14px; border-radius:11px; box-shadow:0 8px 18px -10px rgba(0,0,0,.7);}
.btn-block{width:100%;}
.btn-icon{padding:9px 12px;}

.field{margin-bottom:14px; text-align:right;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--text-soft); margin-bottom:6px;}
.input{
  width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--border-strong);
  background:var(--bg); color:var(--text); font-weight:600; outline:none; text-align:right;
}
.input:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(34,230,192,.16);}
.input::placeholder{color:var(--text-soft); font-weight:500;}

/* ---------- cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:0 26px 60px -24px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.04); padding:22px;
}
.tilt{box-shadow:0 26px 60px -24px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.04), 0 0 0 1px rgba(34,230,192,.12);}
.tilt2{box-shadow:0 26px 60px -24px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.04), 0 0 0 1px rgba(255,111,160,.12);}

/* ---------- toast ---------- */
#toast{
  position:fixed; top:16px; left:50%;
  transform:translateX(-50%) translateY(-8px);
  background:var(--surface-2); color:var(--text); padding:12px 20px; border-radius:12px; font-weight:600;
  font-size:14px; z-index:999; max-width:90vw; text-align:center;
  border:1px solid var(--border-strong);
  box-shadow:0 16px 36px -12px rgba(0,0,0,.8);
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .3s;
}
#toast.show{
  opacity:1; visibility:visible; pointer-events:auto;
  transform:translateX(-50%) translateY(0);
  transition:opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1), visibility 0s linear 0s;
}

/* ---------- header / brand ---------- */
.brand{display:flex; align-items:center; justify-content:center; gap:10px; margin:6px 0 6px;}
.brand h1{
  font-size:26px; margin:0; font-weight:900; letter-spacing:-.3px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.tag{color:var(--text-soft); font-weight:600; font-size:14.5px; text-align:center; margin:0 0 26px;}

/* ---------- lobby ---------- */
.room-code-box{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:4px;}
.room-code{font-size:30px; font-weight:900; letter-spacing:6px; color:var(--text);
  background:var(--surface-2); border:1.5px solid var(--border-strong);
  border-radius:12px; padding:5px 18px;}
.lobby-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:18px; align-items:start; margin-top:20px;}
@media (max-width:720px){.lobby-grid{grid-template-columns:1fr;}}
.section-title{font-weight:800; font-size:15px; margin:0 0 12px; color:var(--brand);}
.player-chip{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; background:var(--bg);}
.player-chip .nm{font-weight:700; flex:1; text-align:right;}
.player-chip .host-badge{font-size:11px; background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#04140F; padding:2px 8px; border-radius:8px; font-weight:700;}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;border:2px solid rgba(255,255,255,.2);flex-shrink:0;}
.settings-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px;}
.settings-row .lbl{font-weight:700; font-size:14px;}
.chips{display:flex; gap:8px; flex-wrap:wrap;}
.chip{padding:7px 14px; border:1.5px solid var(--border-strong); border-radius:20px; font-weight:700; font-size:13.5px; cursor:pointer; background:var(--bg); color:var(--text);}
.chip.active{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#04140F; border-color:transparent;}
.chip.readonly{cursor:default; opacity:.7;}
.empty-note{color:var(--text-soft); font-size:13.5px; text-align:center; padding:14px 0;}

/* ---------- game screen ---------- */
.game-wrap{width:100%; max-width:1020px;}
.turn-info{font-weight:700; font-size:14px; color:var(--text-soft); text-align:center;}
.turn-info b{color:var(--brand);}
.timer-pill{
  display:flex; align-items:center; gap:8px; justify-content:center; margin:0 auto 14px; width:fit-content;
  background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; font-weight:900; font-size:19px;
  padding:9px 22px; border-radius:999px; box-shadow:0 14px 30px -10px rgba(108,107,255,.55); letter-spacing:.5px;
}
.timer-pill .ic{font-size:16px;}
.timer-pill.timer-warn{background:linear-gradient(135deg,var(--coral),#FF8A5C); box-shadow:0 14px 30px -10px rgba(255,84,112,.55);}

.round-card{text-align:center;}
.round-card .round-title{font-weight:800; font-size:14px; color:var(--text-soft); margin-bottom:10px;}
.round-card .round-title b{color:var(--text); font-size:15px;}
.round-dots{display:flex; gap:6px; justify-content:center; margin-bottom:10px;}
.round-dots span{width:7px;height:7px;border-radius:50%; background:var(--border-strong);}
.round-dots span.done{background:linear-gradient(135deg,var(--brand),var(--brand2));}

.game-grid{display:grid; grid-template-columns:200px 1fr 250px; gap:16px; align-items:start;}
@media (max-width:960px){.game-grid{grid-template-columns:1fr 250px;} .left-col{grid-column:1 / -1; order:3;} }
@media (max-width:640px){.game-grid{grid-template-columns:1fr;} .left-col{order:3;}}

.board-card{padding:14px; position:relative;}
.word-display{text-align:center; font-weight:900; margin-bottom:10px; min-height:30px;}
.word-display .blanks{font-size:24px; letter-spacing:8px; color:var(--text);}
.word-display .actual{font-size:24px; letter-spacing:1px; color:var(--pink); text-shadow:0 0 18px rgba(255,111,160,.4);}
canvas#board{
  width:100%; aspect-ratio:4/3; display:block; cursor:crosshair; touch-action:none;
  border-radius:16px; border:3px solid transparent;
  background-image:linear-gradient(#fff,#fff), linear-gradient(135deg,var(--brand),var(--brand2));
  background-origin:border-box; background-clip:content-box, border-box;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.8);
}
.canvas-disabled{cursor:default !important;}

.toolbar{display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap; justify-content:center; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:8px 16px;}
.swatches{display:flex; gap:6px; flex-wrap:wrap; justify-content:center;}
.swatch{width:26px;height:26px;border-radius:50%; border:2px solid var(--border-strong); cursor:pointer; flex-shrink:0;}
.swatch.sel{outline:3px solid var(--brand); outline-offset:2px;}
.sizes{display:flex; gap:6px;}
.size-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--border-strong); background:var(--surface-2); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.size-btn .dot{background:var(--text); border-radius:50%;}
.size-btn.sel{background:var(--surface); outline:2px solid var(--brand);}
.tool-actions{display:flex; gap:8px;}

.side-col{display:flex; flex-direction:column; gap:14px;}
.scoreboard{max-height:230px; overflow-y:auto;}
.score-row{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--border);}
.score-row:last-child{border-bottom:none;}
.score-row .nm{flex:1; font-weight:700; font-size:14px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.score-row .sc{font-weight:900; color:var(--brand); font-size:14.5px;}
.score-row.drawing-now{background:linear-gradient(135deg, rgba(34,230,192,.16), rgba(139,124,255,.16)); border:1px solid rgba(34,230,192,.3); border-radius:10px; padding:7px 8px;}
.score-row.guessed .nm::after{content:" ✓"; color:var(--brand);}
.score-row.offline{opacity:.4;}
.score-row.offline .nm::after{content:" (قطع شد)"; color:var(--text-soft); font-weight:600; font-size:11px;}

.chat-card{display:flex; flex-direction:column; height:290px;}
.chat-list{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding-left:2px;}
.chat-msg{font-size:13.5px; padding:6px 10px; border-radius:10px; background:var(--surface-2); color:var(--text); line-height:1.6;}
.chat-msg b{color:var(--brand2);}
.chat-msg.correct{background:rgba(46,212,122,.16); color:var(--green); font-weight:800; text-align:right; border:1px solid rgba(46,212,122,.35); display:flex; align-items:center; justify-content:space-between;}
.chat-msg.correct::after{content:"✓"; background:var(--green); color:#04140F; width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; flex-shrink:0;}
.chat-msg.system{background:transparent; color:var(--text-soft); text-align:center; font-weight:600;}
.chat-form{display:flex; gap:8px; margin-top:10px;}
.chat-form input{flex:1;}

.choose-overlay,.turnend-overlay{
  position:absolute; inset:0; background:rgba(9,11,20,.94); backdrop-filter:blur(6px); border-radius:16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:20px; text-align:center; z-index:5;
}
.choose-words{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.word-choice-btn{font-size:19px; font-weight:800; padding:16px 22px;}
.reveal-word{font-size:26px; font-weight:900; color:var(--pink); text-shadow:0 0 20px rgba(255,111,160,.45);}

.leaderboard-mini{display:flex; flex-direction:column; gap:6px; width:100%; max-width:280px;}
.lb-row{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--text);}
.lb-row .p{color:var(--brand); font-weight:900;}

/* ---------- final ---------- */
.final-list{display:flex; flex-direction:column; gap:10px; margin:22px 0;}
.final-row{display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--surface); border:1px solid var(--border);}
.final-row .rank{font-size:22px; font-weight:900; width:34px; text-align:center;}
.final-row .nm{flex:1; font-weight:800; font-size:17px; text-align:right;}
.final-row .sc{font-weight:900; font-size:19px; color:var(--brand);}
.final-row.r1{background:linear-gradient(135deg, rgba(255,184,77,.22), rgba(255,184,77,.06)); border-color:rgba(255,184,77,.4);}
.final-row.r2{background:var(--surface-2); border-color:var(--border-strong);}
.final-row.r3{background:linear-gradient(135deg, rgba(255,122,89,.18), rgba(255,122,89,.05)); border-color:rgba(255,122,89,.3);}
.final-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}

.confetti-layer{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:998;}
.confetti-piece{position:absolute; top:-20px; border-radius:2px; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:.9;}}

.pop{animation:popIn .28s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1;}}
.fadeUp{animation:fadeUp .35s ease both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

.conn-banner{position:fixed; bottom:0; left:0; right:0; background:var(--coral); color:#1A0510; text-align:center; font-weight:700; font-size:13.5px; padding:10px; z-index:1000; display:none;}
.conn-banner.show{display:block;}

.footer-note{margin-top:30px; font-size:12px; color:var(--text-soft); text-align:center; opacity:.85; max-width:420px;}

/* ---------- screen transitions ---------- */
#app{transition:opacity .2s ease, transform .25s cubic-bezier(.22,1,.36,1);}
#app.screen-exit{opacity:0; transform:translateY(10px);}

/* ---------- letter-box word blanks ---------- */
.letter-boxes{display:flex; gap:6px; justify-content:center; flex-wrap:wrap;}
.letter-box{width:24px; height:32px; border-bottom:3px solid var(--brand); border-radius:4px; opacity:0; animation:fadeUp .3s ease both;}

/* ---------- chat slide-in ---------- */
.chat-msg.msgIn{animation:msgSlide .25s ease both;}
@keyframes msgSlide{from{opacity:0; transform:translateX(10px);} to{opacity:1; transform:translateX(0);}}

/* ---------- winner flourish ---------- */
.final-row.r1 .rank{display:inline-block; animation:bounce 1.1s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}

/* ==================== HOME SCREEN — REDESIGN ==================== */
.home-screen{position:relative; padding-bottom:64px; overflow:hidden;}
.hm-bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.hm-bg::after{
  content:""; position:absolute; inset:0;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(circle at 50% 38%, #000 0%, transparent 70%);
  mask-image:radial-gradient(circle at 50% 38%, #000 0%, transparent 70%);
}
.hm-orb{position:absolute; border-radius:50%; filter:blur(90px); will-change:transform;}
.hm-orb.o1{width:min(440px,70vw); aspect-ratio:1; background:#6C6BFF; opacity:.42; top:-150px; right:-110px; animation:hmOrb1 18s ease-in-out infinite;}
.hm-orb.o2{width:min(400px,65vw); aspect-ratio:1; background:#8B5CF6; opacity:.36; bottom:-180px; left:-130px; animation:hmOrb2 22s ease-in-out infinite;}
.hm-orb.o3{width:min(280px,45vw); aspect-ratio:1; background:#FF6FA0; opacity:.2; top:42%; left:58%; animation:hmOrb3 26s ease-in-out infinite;}
@keyframes hmOrb1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-46px,54px) scale(1.14);}}
@keyframes hmOrb2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(52px,-40px) scale(1.1);}}
@keyframes hmOrb3{0%,100%{transform:translate(0,0);}50%{transform:translate(-40px,36px);}}

@keyframes hmRise{from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);}}

.hm-top{
  position:relative; z-index:2; width:100%; max-width:1080px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:20px 4px 6px; animation:hmRise .5s ease both;
}
.hm-logo{display:flex; align-items:center; gap:10px; font-weight:900; font-size:19px; color:var(--text);}
.hm-logo-mark{
  width:38px; height:38px; border-radius:13px; display:grid; place-items:center; font-size:18px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  box-shadow:0 12px 26px -12px rgba(108,107,255,.95), inset 0 1px 0 rgba(255,255,255,.3);
  animation:hmMarkFloat 4s ease-in-out infinite;
}
@keyframes hmMarkFloat{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-4px) rotate(4deg);}}
.hm-logo-accent{background:linear-gradient(135deg,#8B5CF6,#FF6FA0); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hm-online{
  display:flex; align-items:center; gap:7px; font-size:12px; font-weight:800; color:var(--text-soft);
  padding:7px 13px; border-radius:999px; background:rgba(46,212,122,.08); border:1px solid rgba(46,212,122,.22);
}
.hm-online-dot{width:7px; height:7px; border-radius:50%; background:var(--green); animation:hmBlink 2s ease-out infinite;}
@keyframes hmBlink{0%{box-shadow:0 0 0 0 rgba(46,212,122,.65);}70%{box-shadow:0 0 0 8px rgba(46,212,122,0);}100%{box-shadow:0 0 0 0 rgba(46,212,122,0);}}

.hm-main{position:relative; z-index:2; width:100%; max-width:460px; display:flex; flex-direction:column; align-items:center; padding-top:6px;}

.hm-hero{position:relative; width:min(300px,74vw); display:grid; place-items:center; animation:hmRise .7s cubic-bezier(.22,1,.36,1) both;}
.hm-halo{position:absolute; width:78%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,rgba(108,107,255,.45),transparent 68%); filter:blur(18px); animation:hmHalo 5s ease-in-out infinite;}
@keyframes hmHalo{0%,100%{transform:scale(1); opacity:.7;}50%{transform:scale(1.18); opacity:1;}}
.hm-art{position:relative; width:100%; height:auto; filter:drop-shadow(0 24px 44px rgba(0,0,0,.55));}
.hm-board{fill:rgba(255,255,255,.028); stroke:rgba(255,255,255,.1); stroke-width:1.5;}
#hmSquiggle{stroke-dasharray:100; stroke-dashoffset:100; animation:hmDraw 4.4s cubic-bezier(.45,.05,.35,1) infinite;}
@keyframes hmDraw{
  0%{stroke-dashoffset:100; opacity:1;}
  62%{stroke-dashoffset:0; opacity:1;}
  86%{stroke-dashoffset:0; opacity:1;}
  100%{stroke-dashoffset:0; opacity:0;}
}
.hm-pencil-g{animation:hmPencilFade 4.4s linear infinite;}
@keyframes hmPencilFade{0%,86%{opacity:1;}100%{opacity:0;}}
.hm-star{transform-box:fill-box; transform-origin:center; animation:hmTwinkle 2.6s ease-in-out infinite;}
@keyframes hmTwinkle{0%,100%{transform:scale(1) rotate(0deg); opacity:.85;}50%{transform:scale(1.25) rotate(18deg); opacity:1;}}
.hm-spark{position:absolute; font-size:22px; pointer-events:none; filter:drop-shadow(0 0 10px rgba(108,107,255,.7)); animation:hmFloat 4.5s ease-in-out infinite;}
.hm-spark.s1{top:0; right:6%;}
.hm-spark.s2{bottom:8%; left:2%; animation-delay:1.4s;}
.hm-spark.s3{top:46%; left:-4%; font-size:16px; animation-delay:2.4s;}
@keyframes hmFloat{0%,100%{transform:translateY(0) rotate(-8deg);}50%{transform:translateY(-15px) rotate(10deg);}}

.hm-title{
  margin:16px 0 0; text-align:center; line-height:1.05;
  font-size:clamp(42px,11vw,64px); font-weight:900; letter-spacing:-2px;
  background:linear-gradient(100deg,#FFFFFF 0%,#B7B5FF 22%,#6C6BFF 42%,#8B5CF6 58%,#FF8FB1 76%,#FFFFFF 100%);
  background-size:250% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent;

.hm-sub{
  margin:14px 0 0; max-width:340px; text-align:center;

.hm-stats{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin-top:24px;}
.hm-stat{
  display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:999px;
  font-size:12.5px; font-weight:700; color:var(--text-soft);
  background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.08);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  transition:transform .25s cubic-bezier(.34,1.4,.64,1), border-color .25s, color .25s, background .25s;
  animation:hmRise .6s cubic-bezier(.22,1,.36,1) both;
}
.hm-stat:nth-child(1){animation-delay:.16s;}
.hm-stat:nth-child(2){animation-delay:.24s;}
.hm-stat:nth-child(3){animation-delay:.32s;}
.hm-stat:hover{transform:translateY(-3px); color:var(--text); border-color:rgba(108,107,255,.45); background:rgba(108,107,255,.12);}

.hm-card{
  position:relative; width:100%; margin-top:26px; padding:22px; border-radius:26px;
  background:linear-gradient(165deg, rgba(30,36,60,.85), rgba(15,19,35,.92));
  border:1px solid rgba(255,255,255,.09);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  box-shadow:0 44px 90px -46px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.08);
  animation:hmRise .75s .12s cubic-bezier(.22,1,.36,1) both;
}
.hm-card::before{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
  background:linear-gradient(150deg, rgba(108,107,255,.75), rgba(255,255,255,0) 35%, rgba(255,255,255,0) 65%, rgba(255,111,160,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
}

.hm-seg{
  position:relative; display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:5px;
  margin-bottom:22px; border-radius:16px;
  background:rgba(8,11,23,.8); border:1px solid rgba(255,255,255,.08);
}
.hm-seg-glider{
  grid-column:1; grid-row:1; z-index:0; border-radius:12px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  box-shadow:0 10px 26px -12px rgba(108,107,255,.95);
  transition:transform .45s cubic-bezier(.34,1.4,.64,1), background .35s, box-shadow .35s;
}
.hm-seg.join .hm-seg-glider{
  transform:translateX(calc(-100% - 4px));
  background:linear-gradient(135deg,#FF6FA0,#FF8A5C);
  box-shadow:0 10px 26px -12px rgba(255,111,160,.95);
}
.hm-seg .seg-btn{
  grid-row:1; position:relative; z-index:1;
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:12px 8px; border:none; border-radius:12px; background:transparent;
  color:var(--text-soft); font-family:inherit; font-weight:800; font-size:14px;
  cursor:pointer; transition:color .3s, transform .2s;
}
.hm-seg .seg-btn:nth-of-type(1){grid-column:1;}
.hm-seg .seg-btn:nth-of-type(2){grid-column:2;}
.hm-seg .seg-btn.active{background:transparent; color:#fff;}
.hm-seg .seg-btn:active{transform:scale(.97);}

.hm-field{margin-bottom:15px; text-align:right;}
.hm-field label{
  display:flex; align-items:center; gap:7px; padding-right:3px; margin-bottom:9px;
  font-size:12.5px; font-weight:800; color:var(--text-soft); letter-spacing:.2px;
}
.hm-input-wrap{position:relative;}
.hm-ico{
  position:absolute; top:50%; right:15px; transform:translateY(-50%);
  font-size:15px; opacity:.55; pointer-events:none; transition:opacity .25s, transform .25s;
}
.hm-input-wrap:focus-within .hm-ico{opacity:1; transform:translateY(-50%) scale(1.15);}
.hm-input{
  width:100%; padding:14px 16px; border-radius:15px;
  border:1.5px solid rgba(255,255,255,.1); background:rgba(8,11,23,.72);
  color:var(--text); font-family:inherit; font-weight:700; font-size:15.5px;
  outline:none; text-align:right;
  transition:border-color .25s, box-shadow .25s, background .25s;
}
.hm-input-wrap .hm-input{padding-right:46px;}
.hm-input::placeholder{color:rgba(139,146,180,.7); font-weight:500;}
.hm-input:hover{border-color:rgba(255,255,255,.18);}
.hm-input:focus{
  border-color:var(--brand); background:rgba(108,107,255,.08);
  box-shadow:0 0 0 4px rgba(108,107,255,.16), 0 8px 30px -14px rgba(108,107,255,.9);
}
.hm-input--code{
  text-align:center; letter-spacing:6px; text-indent:6px;
  font-weight:900; font-size:19px; padding:14px 16px;
}
.hm-input--code::placeholder{letter-spacing:.5px; text-indent:0; font-weight:600; font-size:14px;}

.hm-cta-wrap{position:relative; margin-top:20px; border-radius:18px; --glow:108,107,255;}
.hm-cta-wrap.join{--glow:255,111,160;}
.hm-cta-wrap::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  animation:hmRing 2.8s ease-out infinite;
}
@keyframes hmRing{
  0%{box-shadow:0 0 0 0 rgba(var(--glow), .45);}
  70%{box-shadow:0 0 0 18px rgba(var(--glow), 0);}
  100%{box-shadow:0 0 0 0 rgba(var(--glow), 0);}
}
.hm-cta{
  position:relative; width:100%; padding:17px 24px; border:none; border-radius:18px;
  overflow:hidden; cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-family:inherit; font-weight:900; font-size:16.5px; color:#fff;
  background:linear-gradient(120deg,#6C6BFF 0%,#8B5CF6 45%,#A78BFA 100%);
  background-size:200% auto;
  box-shadow:0 20px 44px -18px rgba(108,107,255,1), inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .2s cubic-bezier(.34,1.4,.64,1), box-shadow .3s, background-position .55s;
}
.hm-cta:hover{
  transform:translateY(-3px); background-position:right center;
  box-shadow:0 30px 60px -20px rgba(108,107,255,1), inset 0 1px 0 rgba(255,255,255,.35);
}
.hm-cta:active{transform:translateY(0) scale(.985);}
.hm-cta::before{
  content:""; position:absolute; top:-10%; bottom:-10%; left:-60%; width:45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-22deg); animation:hmSweep 3.6s ease-in-out infinite;
}
@keyframes hmSweep{0%{left:-60%;}55%,100%{left:130%;}}
.hm-cta-label{position:relative; z-index:2; display:inline-flex; align-items:center; gap:9px;}
.hm-cta-ico{font-size:18px; display:inline-block; animation:hmIco 2.4s ease-in-out infinite;}
@keyframes hmIco{0%,100%{transform:rotate(0) scale(1);}50%{transform:rotate(-12deg) scale(1.14);}}
.hm-cta.join-mode{
  background:linear-gradient(120deg,#FF6FA0 0%,#FF7A59 45%,#FFB84D 100%);
  background-size:200% auto;
  box-shadow:0 20px 44px -18px rgba(255,111,160,1), inset 0 1px 0 rgba(255,255,255,.32);
}
.hm-cta.join-mode:hover{box-shadow:0 30px 60px -20px rgba(255,111,160,1), inset 0 1px 0 rgba(255,255,255,.4);}

.hm-hint{
  margin-top:14px; text-align:center; font-size:12px; font-weight:600;
  color:rgba(139,146,180,.85); line-height:1.9;
  transition:opacity .25s;
}

.hm-howto{
  width:100%; margin-top:20px; border-radius:18px; overflow:hidden;
  background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.07);
  animation:hmRise .6s .3s cubic-bezier(.22,1,.36,1) both;
}
.hm-howto summary{
  list-style:none; cursor:pointer; padding:15px 18px;
  display:flex; align-items:center; justify-content:space-between;
  font-weight:800; font-size:14px; color:var(--text-soft);
  transition:color .25s, background .25s;
}
.hm-howto summary::-webkit-details-marker{display:none;}
.hm-howto summary::after{content:"⌄"; font-size:19px; line-height:1; transition:transform .3s;}
.hm-howto[open] summary::after{transform:rotate(180deg);}
.hm-howto summary:hover{color:var(--text); background:rgba(255,255,255,.03);}
.hm-howto-body{
  padding:14px 18px 18px; font-size:13.5px; line-height:2.1; color:var(--text-soft);
  border-top:1px solid rgba(255,255,255,.05);
}
.hm-howto-body b{color:var(--text);}

.hm-foot{
  margin-top:26px; font-size:11.5px; color:rgba(139,146,180,.6); text-align:center;
  animation:hmRise .6s .4s cubic-bezier(.22,1,.36,1) both;
}

@media (max-width:420px){
  .hm-online{font-size:11px; padding:6px 10px;}
  .hm-card{padding:18px 16px; border-radius:22px;}
  .hm-cta{padding:16px 18px; font-size:15.5px;}
}
</style>

<body>
<div id="toast"></div>
<div id="connBanner" class="conn-banner">اتصال قطع شد — در حال تلاش برای اتصال دوباره...</div>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ============================= UTIL ============================= */
const $ = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));
const app = $('#app');

function toast(msg, ms){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=> t.classList.remove('show'), ms||2600);
}
function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function genLocalId(prefix){ return (prefix||'id')+'_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function faNum(n){
  const map = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
  return n.toString().split('').map(c=> map[c]!==undefined?map[c]:c).join('');
}
const PALETTE = ['#FF6A5B','#2FB6A6','#7C83FD','#FFC857','#FF8FB1','#59C36A','#5AA9E6','#C77DFF'];
function colorFor(idx){ return PALETTE[idx % PALETTE.length]; }

function topBar(mode){
  const logo = `<div class="topbar-logo"><span class="pencil">✏️</span>خط<span class="g">خطی</span></div>`;
  if(mode === 'home'){
    return `<div class="topbar">${logo}
      <div class="topbar-nav"><a class="active">خانه</a><a>راهنما</a><a>اتاق‌ها</a></div>
      <span class="btn btn-sm btn-ghost" style="visibility:hidden;">ورود</span>
    </div>`;
  }
  if(mode === 'room'){
    return `<div class="topbar">${logo}
      <div class="topbar-room">اتاق <span dir="ltr">#${escapeHtml(S.code||'')}</span><span class="pub">عمومی</span></div>
      <div class="topbar-user"><div class="avatar" style="width:30px;height:30px;font-size:13px;background:${colorFor((S.players[S.me.id]||{}).colorIdx||0)}">${escapeHtml((S.me.name||'?').slice(0,1))}</div><span>${escapeHtml(S.me.name||'')}</span></div>
    </div>`;
  }
  return `<div class="topbar">${logo}<div></div><div></div></div>`;
}

/* ============================= WEBSOCKET ============================= */
let ws = null;
let wsReady = false;

function connectWs(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host);
  ws.addEventListener('open', ()=>{
    wsReady = true;
    $('#connBanner').classList.remove('show');
  });
  ws.addEventListener('message', (ev)=>{
    let msg;
    try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    onServerMessage(msg);
  });
  ws.addEventListener('close', ()=>{
    wsReady = false;
    if(S.code && S.screen !== 'home'){
      $('#connBanner').classList.add('show');
    }
  });
  ws.addEventListener('error', ()=>{});
}
function sendMsg(type, data){
  if(!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify(Object.assign({type}, data||{})));
}
connectWs();

/* ============================= STATE ============================= */
const S = {
  me: { id:null, name:'' },
  screen: null,
  mounting: false,
  code: null,
  isHost: false,
  meta: null,
  players: {},
  tool: { color:'#22252B', size:6, mode:'pen' },
  drawing: false,
  curStrokeId: null,
  localStrokes: [],
  remoteStrokes: {},
  lastTurnSeq: null,
};

/* ============================= ROUTER ============================= */
function goTo(screen){
  if(S.screen === screen) return false;
  S.screen = screen;
  S.mounting = true;
  const doMount = ()=>{
    app.innerHTML = '';
    if(screen==='home') mountHome();
    else if(screen==='lobby') mountLobby();
    else if(screen==='game') mountGame();
    else if(screen==='final') mountFinal();
    S.mounting = false;
    requestAnimationFrame(()=> requestAnimationFrame(()=> app.classList.remove('screen-exit')));
  };
  if(app.children.length){
    app.classList.add('screen-exit');
    setTimeout(doMount, 170);
  } else {
    doMount();
  }
  return true;
}

/* ============================= SERVER MESSAGE DISPATCH ============================= */
function onServerMessage(msg){
  switch(msg.type){
    case 'joined':
      S.code = msg.code; S.me.id = msg.playerId; S.isHost = msg.isHost;
      goTo('lobby');
      break;
    case 'errorMsg':
      toast(msg.message);
      break;
    case 'state': {
      const prevStatus = S.meta ? S.meta.status : null;
      const prevSeq = S.meta ? S.meta.turnSeq : null;
      S.meta = msg.meta; S.players = msg.players;
      S.isHost = msg.meta.hostId === S.me.id;
      let changed;
      if(msg.meta.status === 'lobby') changed = goTo('lobby');
      else if(msg.meta.status === 'final') changed = goTo('final');
      else changed = goTo('game');
      if(!changed && !S.mounting){
        if(S.screen === 'lobby') renderLobbyDynamic();
        if(S.screen === 'game') updateGameDynamic(prevStatus, prevSeq);
        if(S.screen === 'final') renderFinalDynamic();
      }
      break;
    }
    case 'chatMessage':
      appendChatMessage(msg);
      break;
    case 'canvasSnapshot':
      S.localStrokes = msg.strokes || [];
      S.remoteStrokes = {};
      redrawAll(msg.strokes || []);
      break;
    case 'strokeStart': {
      const stroke = {id:msg.id, tool:msg.tool, color:msg.color, size:msg.size, points:[msg.point]};
      S.remoteStrokes[msg.id] = stroke;
      drawSegment(stroke, 0, 0);
      break;
    }
    case 'strokePoint': {
      const st = S.remoteStrokes[msg.id];
      if(st && msg.point){ st.points.push(msg.point); drawSegment(st, st.points.length-2, st.points.length-1); }
      break;
    }
    case 'strokeEnd':
      delete S.remoteStrokes[msg.id];
      break;
  }
}

/* ============================= HOME ============================= */
let homeMode = 'create';
function mountHome(){
  const params = new URLSearchParams(location.search);
  const prefillCode = (params.get('room')||'').toUpperCase().slice(0,5);
  homeMode = prefillCode ? 'join' : 'create';

  app.innerHTML = `
  <div class="screen home-screen">
    <div class="hm-bg" aria-hidden="true">
      <span class="hm-orb o1"></span>
      <span class="hm-orb o2"></span>
      <span class="hm-orb o3"></span>
    </div>

    <header class="hm-top">
      <div class="hm-logo">
        <span class="hm-logo-mark">✏️</span>
        <span>خط<span class="hm-logo-accent">خطی</span></span>
      </div>
      <div class="hm-online"><span class="hm-online-dot"></span> آنلاین و رایگان</div>
    </header>

    <main class="hm-main">
      <div class="hm-hero">
        <div class="hm-halo"></div>
        <svg class="hm-art" viewBox="0 0 260 210" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hmGA" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#8B8AFF"/>
              <stop offset="55%" stop-color="#6C6BFF"/>
              <stop offset="100%" stop-color="#8B5CF6"/>
            </linearGradient>
            <linearGradient id="hmGB" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FFB84D"/>
              <stop offset="100%" stop-color="#FF6FA0"/>
            </linearGradient>
            <linearGradient id="hmGC" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFE7C2"/>
              <stop offset="100%" stop-color="#FFC857"/>
            </linearGradient>
          </defs>

          <rect class="hm-board" x="14" y="14" width="232" height="182" rx="28"/>

          <path id="hmSquiggle" pathLength="100"
                d="M52 152 C 74 82, 100 176, 128 116 S 184 66, 210 122"
                stroke="url(#hmGA)" stroke-width="9" stroke-linecap="round" fill="none"/>

          <path class="hm-star" d="M204 36 l4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 z" fill="url(#hmGB)"/>

          <g class="hm-pencil-g">
            <animateMotion dur="4.4s" repeatCount="indefinite" rotate="auto"
                           calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.62;1">
              <mpath href="#hmSquiggle"/>
            </animateMotion>
            <g>
              <path d="M0 0 L-13 -6 L-13 6 Z" fill="url(#hmGC)"/>
              <rect x="-44" y="-6.5" width="31" height="13" rx="3.5" fill="url(#hmGB)"/>
              <rect x="-51" y="-6.5" width="7" height="13" rx="3.5" fill="#FF6FA0"/>
            </g>
          </g>
        </svg>
        <span class="hm-spark s1">✨</span>
        <span class="hm-spark s2">🎨</span>
        <span class="hm-spark s3">⭐</span>
      </div>

      <h1 class="hm-title">خط‌خطی</h1>
      <p class="hm-sub">یکی می‌کشد، بقیه حدس می‌زنند — <b>همین حالا</b> با دوستات بازی کن</p>

      <div class="hm-stats">
        <div class="hm-stat"><span>👥</span> ۲ تا ۸ بازیکن</div>
        <div class="hm-stat"><span>⚡</span> شروع فوری</div>
        <div class="hm-stat"><span>🎯</span> تا ۳ راند</div>
      </div>

      <div class="hm-card">
        <div class="hm-seg ${homeMode==='join'?'join':''}" id="hmSeg">
          <span class="hm-seg-glider"></span>
          <button type="button" class="seg-btn" data-mode="create">✨ ساخت اتاق</button>
          <button type="button" class="seg-btn" data-mode="join">🔗 پیوستن</button>
        </div>

        <div class="hm-field">
          <label><span>👤</span> اسمت چیه؟</label>
          <div class="hm-input-wrap">
            <span class="hm-ico">✏️</span>
            <input class="hm-input" id="nameInput" maxlength="16" placeholder="مثلاً نیلوفر" autocomplete="off">
          </div>
        </div>

        <div class="hm-field" id="joinCodeField">
          <label><span>🔑</span> کد اتاق</label>
          <input class="hm-input hm-input--code" id="codeInput" maxlength="5" placeholder="کد اتاق"
                 value="${escapeHtml(prefillCode)}">
        </div>

        <div class="hm-cta-wrap ${homeMode==='join'?'join':''}" id="ctaWrap">
          <button class="hm-cta ${homeMode==='join'?'join-mode':''}" id="primaryActionBtn"></button>
        </div>

        <div class="hm-hint" id="hmHint"></div>
      </div>

      <details class="hm-howto">
        <summary>راهنمای بازی</summary>
        <div class="hm-howto-body">
          ۱. یک نفر <b>نقاش</b> می‌شود و یک کلمه از بین ۳ گزینه انتخاب می‌کند.<br>
          ۲. نقاش کلمه را روی تخته می‌کشد، بقیه حدس می‌زنند.<br>
          ۳. هرکس زودتر درست حدس بزند، <b>امتیاز بیشتری</b> می‌گیرد.<br>

/* ============================= CANVAS / DRAWING ============================= */
let ctx = null;
function setupCanvas(){
  const canvas = $('#board');
  ctx = canvas.getContext('2d');
  clearCanvasLocal();

  function toNorm(clientX, clientY){
    const r = canvas.getBoundingClientRect();
    return [ (clientX-r.left)/r.width, (clientY-r.top)/r.height ];
  }
  function isDrawerNow(){
    return S.meta && S.meta.status==='drawing' && S.meta.currentDrawerId === S.me.id;
  }
  function pos(e){ return toNorm(e.clientX, e.clientY); }
  function start(e){
    if(!isDrawerNow()) return;
    e.preventDefault();
    S.drawing = true;
    const [x,y] = pos(e);
    const id = genLocalId('s');
    S.curStrokeId = id;
    const stroke = { id, tool:S.tool.mode, color:S.tool.color, size:S.tool.size, points:[[x,y]] };
    S.localStrokes.push(stroke);
    sendMsg('strokeStart', {id, tool:S.tool.mode, color:S.tool.color, size:S.tool.size, point:[x,y]});
  }
  function move(e){
    if(!S.drawing || !isDrawerNow()) return;
    e.preventDefault();
    const [x,y] = pos(e);
    const stroke = S.localStrokes[S.localStrokes.length-1];
    if(!stroke) return;
    const pts = stroke.points;
    pts.push([x,y]);
    drawSegment(stroke, pts.length-2, pts.length-1);
    sendMsg('strokePoint', {id: stroke.id, point:[x,y]});
  }
  function end(){
    if(!S.drawing) return;
    S.drawing = false;
    if(S.curStrokeId) sendMsg('strokeEnd', {id: S.curStrokeId});
    S.curStrokeId = null;
  }
  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}

function drawSegment(stroke, i0, i1){
  const canvas = $('#board');
  if(!canvas || !ctx) return;
  const p0 = stroke.points[i0], p1 = stroke.points[i1];
  if(!p0||!p1) return;
  ctx.save();
  ctx.globalCompositeOperation = stroke.tool==='eraser' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = stroke.color;
  ctx.lineWidth = stroke.size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(p0[0]*canvas.width, p0[1]*canvas.height);
  ctx.lineTo(p1[0]*canvas.width, p1[1]*canvas.height);
  ctx.stroke();
  ctx.restore();
  if(stroke.points.length === 1){
    ctx.save();
    ctx.globalCompositeOperation = stroke.tool==='eraser' ? 'destination-out' : 'source-over';
    ctx.fillStyle = stroke.color;
    ctx.beginPath();
    ctx.arc(p0[0]*canvas.width, p0[1]*canvas.height, stroke.size/2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}
function redrawAll(strokes){
  const canvas = $('#board');
  if(!canvas || !ctx) return;
  ctx.save(); ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore();
  (strokes||[]).forEach(st=>{
    if(st.points.length <= 1){ drawSegment(st,0,0); return; }
    for(let i=0;i<st.points.length-1;i++) drawSegment(st,i,i+1);
  });
}
function clearCanvasLocal(){
  const canvas = $('#board');
  if(ctx && canvas){ ctx.save(); ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore(); }
}

function setupToolbar(){
  const colors = ['#22252B','#FFFFFF','#FF6A5B','#FFC857','#2FB6A6','#5AA9E6','#7C83FD','#FF8FB1','#59C36A','#8B5E34'];
  const sw = $('#swatches');
  sw.innerHTML = colors.map(c=> `<span class="swatch ${c===S.tool.color?'sel':''}" data-c="${c}" style="background:${c}; ${c==='#FFFFFF'?'box-shadow:inset 0 0 0 1px #ccc;':''}"></span>`).join('');
  $$('.swatch', sw).forEach(el=> el.onclick = ()=>{
    S.tool.color = el.dataset.c; S.tool.mode = 'pen';
    $$('.swatch', sw).forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
    $('#eraserBtn').style.outline = 'none';
  });

  const sizes = [3,7,14];
  const sizesEl = $('#sizes');
  sizesEl.innerHTML = sizes.map((s,i)=> `<button type="button" class="size-btn ${s===S.tool.size?'sel':''}" data-s="${s}"><span class="dot" style="width:${6+i*4}px;height:${6+i*4}px;"></span></button>`).join('');
  $$('.size-btn', sizesEl).forEach(el=> el.onclick = ()=>{
    S.tool.size = parseInt(el.dataset.s);
    $$('.size-btn', sizesEl).forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
  });

  $('#eraserBtn').onclick = ()=>{
    S.tool.mode = S.tool.mode==='eraser' ? 'pen' : 'eraser';
    $('#eraserBtn').style.outline = S.tool.mode==='eraser' ? '2.5px solid var(--coral)' : 'none';
  };
  $('#undoBtn').onclick = ()=>{ sendMsg('undo', {}); };
  $('#clearBtn').onclick = ()=>{ sendMsg('clearCanvas', {}); };
}

function fireConfetti(count, duration){
  count = count || 60; duration = duration || 5200;
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  document.body.appendChild(layer);
  const colors = PALETTE;
  for(let i=0;i<count;i++){
    const d = document.createElement('div');
    d.className = 'confetti-piece';
    const size = 6+Math.random()*7;
    d.style.width = size+'px';
    d.style.height = (size*0.5)+'px';
    d.style.left = Math.random()*100+'vw';
    d.style.background = colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration = (Math.min(2.5,duration/1000)+Math.random()*1.2)+'s';
    d.style.animationDelay = (Math.random()*0.4)+'s';
    layer.appendChild(d);
  }
  setTimeout(()=> layer.remove(), duration+700);
}

/* ============================= BOOT ============================= */
goTo('home');
})();
</script>
